<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ôn giữa kì KHTN 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;600;700&display=swap&subset=vietnamese">
<style>/* Layout: sổ tay ô li. Thanh điều hướng trên, nội dung giữa, mỗi môn một màu bút. */
:root{
 --bg:#F3F6FB; --paper:#FFFFFF; --ink:#14213D; --muted:#56637E; --line:#D7DFEC; --grid:rgba(47,111,222,.07);
 --hoa:#D9481F; --sinh:#128A5C; --ly:#2A62D0; --hi:#FFD84D; --ok:#0E8A63; --okbg:#E3F6EE; --bad:#C92F45; --badbg:#FDECEF;
 --tint:#EEF3FB; --shadow:0 1px 0 rgba(20,33,61,.06),0 6px 20px rgba(20,33,61,.06);
 --fd:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif; --fb:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0E1525; --paper:#162039; --ink:#E9EFFB; --muted:#9BA9C6; --line:#2B3A5C; --grid:rgba(120,160,255,.06);
 --hoa:#FF8159; --sinh:#3BD39A; --ly:#7AA4FF; --ok:#3DD6A0; --okbg:#10352B; --bad:#FF7487; --badbg:#3A1822; --tint:#1B2746;
 --shadow:0 1px 0 rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0E1525; --paper:#162039; --ink:#E9EFFB; --muted:#9BA9C6; --line:#2B3A5C; --grid:rgba(120,160,255,.06);
 --hoa:#FF8159; --sinh:#3BD39A; --ly:#7AA4FF; --ok:#3DD6A0; --okbg:#10352B; --bad:#FF7487; --badbg:#3A1822; --tint:#1B2746;
 --shadow:0 1px 0 rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--fb);
 background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3,h4{font-family:var(--fd);line-height:1.2;margin:0 0 .4em;text-wrap:balance}
h1{font-size:clamp(28px,5vw,44px);font-weight:800} h2{font-size:clamp(22px,3.4vw,30px);font-weight:700} h3{font-size:20px;font-weight:700} h4{font-size:17px}
p{margin:.5em 0} a{color:var(--ly)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--ink);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--fd);font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand i{width:30px;height:30px;border-radius:8px;background:var(--hi);color:#14213D;display:grid;place-items:center;font-style:normal;font-size:16px;border:2px solid #14213D}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;border:2px solid transparent}
nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
nav a:hover{border-color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--hi);color:#14213D;font-weight:700;font-size:13px;border:2px solid #14213D}
.iconbtn{background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:4px 10px;font-weight:700;font-size:13px}
main{padding-top:26px;display:block}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;border:2px solid var(--ink);background:var(--paper);font-weight:700;text-decoration:none;color:var(--ink);box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(1px);box-shadow:0 2px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.pri{background:var(--hi);color:#14213D;border-color:#14213D;box-shadow:0 3px 0 #14213D}
.btn.sm{padding:5px 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:2px solid currentColor}
.t-hoa{color:var(--hoa)} .t-sinh{color:var(--sinh)} .t-ly{color:var(--ly)}
.bar{height:10px;border-radius:99px;background:var(--tint);border:1.5px solid var(--ink);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);transition:width .5s}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center;margin-bottom:22px}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.hl{background:linear-gradient(transparent 55%,var(--hi) 55%);padding:0 4px}
.steps3{display:grid;gap:12px;counter-reset:s}
.steps3 li{list-style:none;display:flex;gap:12px;align-items:flex-start}
.steps3 b.n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--fd)}
ul.plain{padding:0;margin:0}
.lcard{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;position:relative}
.lcard:hover{transform:translateY(-2px)}
.lcard .done{position:absolute;right:12px;top:12px;color:var(--ok);font-weight:700;font-size:13px}
.subjhead{display:flex;align-items:center;gap:10px;margin:26px 0 12px;border-bottom:3px solid currentColor;padding-bottom:4px}
/* lesson */
.crumb{font-size:14px;margin-bottom:8px}
.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.tabs button{padding:7px 16px;border-radius:10px;border:2px solid var(--ink);background:var(--paper);font-weight:700}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.step{margin:14px 0}
.step .sh{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.step .sh b{background:var(--hi);color:#14213D;border:2px solid #14213D;border-radius:8px;padding:0 9px;font-family:var(--fd)}
.step ul,.step ol{padding-left:22px;margin:.4em 0} .step li{margin:.25em 0}
.tb{border-collapse:collapse;width:100%;font-size:15px;display:block;overflow-x:auto}
.tb th,.tb td{border:1.5px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.tb th{background:var(--tint)}
.eq{font-family:var(--fd);font-size:20px;font-weight:700;background:var(--tint);border-left:6px solid var(--hi);padding:10px 14px;border-radius:8px;margin:10px 0;overflow-x:auto}
.map{font-size:15px;background:var(--tint);padding:8px 12px;border-radius:8px;margin:8px 0;overflow-x:auto}
.tip{background:var(--okbg);border-radius:8px;padding:8px 12px;font-size:15px}
.signs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.signs span{background:var(--tint);border-radius:8px;padding:4px 10px;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.two{grid-template-columns:1fr}}
.two>div{background:var(--tint);border-radius:10px;padding:10px 14px}
.chk{margin-top:14px;border:2px dashed var(--ink);border-radius:12px;padding:12px 14px;background:var(--paper)}
.chk .q{font-weight:700;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:var(--paper);transition:border-color .1s,background .1s}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-weight:700;font-size:13px}
.opt.ok{background:var(--okbg);border-color:var(--ok)} .opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt.reveal{border-color:var(--ok);border-style:dashed}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:15px;animation:pop .25s}
.fb.ok{background:var(--okbg);border:2px solid var(--ok)} .fb.bad{background:var(--badbg);border:2px solid var(--bad)}
.fb b.big{font-family:var(--fd);font-size:18px;display:block}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.fig{margin:8px 0}
.q-num{font-family:var(--fd);font-weight:800;margin-right:6px}
/* video */
.screen{position:relative;aspect-ratio:16/9;max-width:100%;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;box-shadow:var(--shadow)}
.scene{position:absolute;inset:0;padding:4% 6%;display:flex;flex-direction:column;justify-content:center;gap:2%;animation:sc .5s}
@keyframes sc{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.scene .big{font-family:var(--fd);font-weight:800;font-size:clamp(24px,5.6cqw,54px);line-height:1.1}
.screen{container-type:inline-size}
.scene .sub{font-size:clamp(14px,2.6cqw,24px);color:var(--muted)}
.scene ul{margin:0;padding:0;list-style:none;display:grid;gap:1.2cqw}
.scene li{font-size:clamp(14px,3cqw,28px);font-weight:600;background:var(--tint);border-left:6px solid var(--hi);padding:.5cqw 1.6cqw;border-radius:8px;opacity:0;animation:li .5s forwards}
@keyframes li{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.scene .f{font-family:var(--fd);font-size:clamp(18px,4.2cqw,40px);font-weight:700;background:var(--tint);border-left:8px solid var(--hi);padding:1cqw 2cqw;border-radius:10px;opacity:0;animation:li .5s forwards}
.scene .ct{font-family:var(--fd);font-size:clamp(16px,3.2cqw,30px);font-weight:700}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:3cqw}
.cmp>div{background:var(--tint);border-radius:12px;padding:1.6cqw 2cqw;opacity:0;animation:li .5s forwards}
.cmp h4{font-size:clamp(15px,3cqw,28px)} .cmp p{margin:.2em 0;font-size:clamp(13px,2.5cqw,23px)}
.scene svg{width:100%;height:100%;max-height:100%}
.cap{margin-top:10px;padding:10px 14px;background:var(--ink);color:var(--bg);border-radius:10px;font-size:16px;min-height:3.4em}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.dots{display:flex;gap:6px;flex:1;min-width:120px}.dots i{flex:1;height:8px;border-radius:5px;background:var(--line);border:1.5px solid var(--ink)}
.dots i.on{background:var(--hi)} .dots i.past{background:var(--ok)}
/* tests */
.testrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.testrow .info{flex:1;min-width:220px}
.qblock{margin:16px 0;padding:14px;border:2px solid var(--ink);border-radius:12px;background:var(--paper)}
.qblock .qt{font-weight:600;margin-bottom:10px}
.subq{margin:10px 0 0;padding-top:10px;border-top:1.5px dashed var(--line)}
.subq label{font-weight:600;display:block;margin-bottom:4px}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px 10px}
textarea:focus,input[type=text]:focus{border-color:var(--ink);outline:none}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sticky{position:sticky;bottom:8px;z-index:5;margin-top:18px;padding-bottom:env(safe-area-inset-bottom,0px)}
.score{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 16px;border:2px solid var(--ink)}
.score b{font-family:var(--fd);font-size:24px}
.bigscore{font-family:var(--fd);font-size:64px;font-weight:800;line-height:1}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;border:2px solid var(--ink);background:var(--paper);font-weight:600;font-size:14px;margin:4px 6px 0 0}
.badge.lock{opacity:.4;filter:grayscale(1)}
.pp{display:grid;gap:10px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;z-index:60;animation:pop .25s;max-width:90vw}
.num{font-variant-numeric:tabular-nums}
.sup{vertical-align:super;font-size:.7em}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}.scene li,.scene .f,.cmp>div{opacity:1}}
/* svg visuals */
.vis text{font-family:var(--fd);fill:var(--ink)}
.fl{animation:fl 4s ease-in-out infinite alternate}
@keyframes fl{from{transform:translateY(0)}to{transform:translateY(-22px)}}
.sk{animation:sk 4s ease-in-out infinite alternate}
@keyframes sk{from{transform:translateY(0)}to{transform:translateY(18px)}}
.fi{opacity:0;animation:li 1s forwards}
</style>
</head>
<body>
<div id="app"></div>
<script>/* ===== 8 ĐỀ KIỂM TRA (chép từ file scan) ===== */
const FIG = {
  pipette:`<svg viewBox="0 0 120 60" width="150" role="img" aria-label="Hình dụng cụ có đầu cao su, ống thủy tinh nhỏ dài"><rect x="6" y="22" width="28" height="18" rx="9" fill="#2b2f3a"/><rect x="32" y="26" width="14" height="10" fill="#555b6b"/><polygon points="46,27 112,33 46,35" fill="#cfe3f1" stroke="#2b2f3a" stroke-width="1.5"/></svg>`,
  electric:`<svg viewBox="0 0 100 90" width="120" role="img" aria-label="Biển báo tam giác có tia chớp"><polygon points="50,6 94,82 6,82" fill="#ffd23f" stroke="#111" stroke-width="5" stroke-linejoin="round"/><polygon points="55,26 38,52 50,52 44,72 64,44 52,44" fill="#111"/></svg>`,
  oxidizer:`<svg viewBox="0 0 100 100" width="110" role="img" aria-label="Biển báo hình thoi viền đỏ: ngọn lửa phía trên vòng tròn"><polygon points="50,4 96,50 50,96 4,50" fill="#fff" stroke="#d62828" stroke-width="6"/><circle cx="50" cy="64" r="11" fill="none" stroke="#111" stroke-width="4"/><path d="M50 22c6 8 14 12 10 24-3 8-17 8-20 0-3-8 6-12 10-24z" fill="#111"/></svg>`,
  biohazard:`<svg viewBox="0 0 100 100" width="100" role="img" aria-label="Ba vòng tròn lồng nhau"><g fill="none" stroke="#111" stroke-width="5"><circle cx="50" cy="36" r="20"/><circle cx="36" cy="60" r="20"/><circle cx="64" cy="60" r="20"/></g></svg>`
};

const TESTS = [
/* ------------------------------------------------ ĐỀ 1 */
{ id:'gk1', short:'Đề GK 1', title:'Đề kiểm tra giữa học kì 1 – KHTN 8', sub:'Lý + Hóa + Sinh · 60 phút · 16 trắc nghiệm + 5 tự luận', time:60, tnPts:4, tlPts:6, tag:'Tổng hợp',
 mc:[
 {q:'Biển báo nào sau đây cảnh báo về chất độc hại sinh học trong phòng thí nghiệm?', o:['Hình ngọn lửa.','Hình đầu lâu có hai xương chéo.','Hình ba lá cánh quạt tròn.','Hình ba vòng tròn lồng vào nhau có ba nhánh nhọn.'], a:3, why:'Biểu tượng chất độc hại sinh học (biohazard) gồm ba vòng tròn lồng vào nhau, ba nhánh nhọn. Đầu lâu = chất độc; ngọn lửa = dễ cháy; cánh quạt tròn = phóng xạ.', fig:'biohazard', lesson:'h1'},
 {q:'Hiện tượng nào sau đây là hiện tượng hóa học?', o:['Thủy tinh nóng chảy được thổi thành bình cầu.','Đốt cháy mẫu gỗ trong không khí tạo thành than và khí carbon dioxide.','Cồn để trong lọ không kín bị bay hơi.','Hòa tan muối ăn vào nước thu được nước muối.'], a:1, why:'Đốt gỗ tạo ra chất mới (than, khí carbon dioxide) nên là biến đổi hóa học. Ba hiện tượng còn lại chỉ đổi trạng thái hoặc hòa tan, không tạo chất mới.', lesson:'h2'},
 {q:'Đường kính pit-tông nhỏ của một máy thủy lực là 2,5 cm. Hỏi diện tích tối thiểu của pit-tông lớn là bao nhiêu để tác dụng một lực 100 N lên pit-tông nhỏ có thể nâng được một ô tô có trọng lượng 35 000 N?', o:['S = 171,5 cm².','S = 1 715 cm².','S = 17 150 cm².','Một giá trị khác.'], a:1, why:'Diện tích pit-tông nhỏ s = π·d²/4 = 3,14 × 2,5² / 4 ≈ 4,9 cm². Máy thủy lực: F/f = S/s ⇒ S = s · F/f = 4,9 × 35 000/100 = 4,9 × 350 ≈ 1 715 cm². (Bản scan khoanh C nhưng tính ra đáp án đúng là B.)', lesson:'l4'},
 {q:'Cho các phát biểu sau về thiết bị điện:<br>(a) Công tắc (khóa K) dùng để đóng, ngắt mạch điện.<br>(b) Vôn kế là thiết bị dùng để đo cường độ dòng điện.<br>(c) Joulemeter là thiết bị dùng để đo công suất, điện áp, dòng điện, năng lượng điện cung cấp cho mạch điện.<br>(d) Máy đo pH dùng để đo pH của môi trường.<br>Số phát biểu đúng là', o:['2.','3.','4.','1.'], a:1, why:'(a), (c), (d) đúng. (b) sai vì vôn kế đo hiệu điện thế (điện áp); ampe kế mới đo cường độ dòng điện. Có 3 phát biểu đúng.', lesson:'h1'},
 {q:'Phản ứng nào sau đây là phản ứng toả nhiệt?', o:['Phản ứng nung đá vôi CaCO₃.','Phản ứng đốt cháy khí gas.','Phản ứng hòa tan viên C sủi vào nước.','Phản ứng phân hủy đường.'], a:1, why:'Đốt cháy nhiên liệu luôn tỏa nhiệt. Nung đá vôi và phân hủy đường cần cung cấp nhiệt liên tục nên là phản ứng thu nhiệt.', lesson:'h2'},
 {q:'Khí methane (CH₄) nặng hay nhẹ hơn không khí bao nhiêu lần?', o:['Nhẹ hơn không khí khoảng 0,55 lần.','Nặng hơn không khí khoảng 1,81 lần.','Nhẹ hơn không khí khoảng 1,21 lần.','Nặng hơn không khí khoảng 0,55 lần.'], a:0, why:'M(CH₄) = 12 + 4 = 16. Tỉ khối so với không khí d = 16/29 ≈ 0,55 < 1 nên CH₄ nhẹ hơn không khí, bằng khoảng 0,55 lần.', lesson:'h4'},
 {q:'(Lý) Công thức tính khối lượng riêng của một chất là:', o:['D = m / V','D = m · V','D = V / m','D = P / V'], a:0, why:'Khối lượng riêng D = khối lượng m chia thể tích V. Đơn vị kg/m³ hoặc g/cm³. (Bản scan khoanh B nhưng đáp án đúng là A.)', lesson:'l1'},
 {q:'Chọn cặp từ thích hợp để điền vào các chỗ trống: Xương to ra về bề ngang là nhờ các tế bào …(1)… tạo ra những tế bào mới đẩy …(2)… và hóa xương.', o:['(1): mô xương cứng ; (2): ra ngoài','(1): mô xương xốp ; (2): vào trong','(1): màng xương ; (2): ra ngoài','(1): màng xương ; (2): vào trong'], a:3, why:'Màng xương bọc ngoài xương. Các tế bào màng xương phân chia, tạo tế bào mới đẩy vào trong và hóa xương nên xương to ra bề ngang. (Bản scan khoanh A, đáp án đúng theo sách là D.)', lesson:'s31'},
 {q:'Áp suất chất rắn phụ thuộc vào những yếu tố nào?', o:['Khối lượng riêng của chất rắn và thể tích vật.','Diện tích bề mặt bị ép và độ lớn của áp lực.','Độ cao của chất rắn và trọng lượng của vật.','Lực đẩy Archimedes tác dụng lên vật đứng yên.'], a:1, why:'p = F/S nên áp suất phụ thuộc áp lực F và diện tích bị ép S.', lesson:'l2'},
 {q:'Phát biểu nào sau đây đúng khi nói về tác dụng của máy thủy lực?', o:['Máy thủy lực cho ta lợi về đường đi.','Máy thủy lực cho ta lợi về công.','Máy thủy lực cho ta lợi về lực.','Máy thủy lực cho ta lợi về diện tích mặt tiếp xúc.'], a:2, why:'Máy thủy lực cho lợi về lực: lực nâng lớn hơn lực tác dụng bấy nhiêu lần thì pit-tông nhỏ phải đi quãng đường dài hơn bấy nhiêu lần. Không có máy cơ nào cho lợi về công.', lesson:'l4'},
 {q:'Một vật nhúng trong chất lỏng bị chất lỏng tác dụng một lực đẩy hướng thẳng đứng từ dưới lên. Lực này gọi là:', o:['Lực đàn hồi.','Lực ma sát.','Lực đẩy Archimedes.','Trọng lực.'], a:2, why:'Lực đẩy thẳng đứng từ dưới lên do chất lỏng (hoặc chất khí) tác dụng lên vật nhúng trong nó là lực đẩy Archimedes.', lesson:'l3'},
 {q:'Cơ thể người được chia làm mấy phần chính? Đó là những phần nào?', o:['2 phần: Phần đầu và phần thân.','3 phần: Phần đầu, phần thân và các chi (tay, chân).','4 phần: Phần đầu, phần ngực, phần bụng và các chi.','2 phần: Phần ngực và phần bụng.'], a:1, why:'Cơ thể người gồm 3 phần: đầu, thân (ngực + bụng, ngăn cách bởi cơ hoành) và các chi.', lesson:'s30'},
 {q:'Thành phần hóa học của xương gồm có:', o:['Chất hữu cơ (chất cốt giao) và chất vô cơ (muối khoáng).','Chỉ gồm chất hữu cơ (chất cốt giao).','Chỉ gồm chất vô cơ (muối khoáng).','Nước và chất béo.'], a:0, why:'Chất hữu cơ (cốt giao) làm xương mềm dẻo, chất vô cơ (muối calcium…) làm xương cứng chắc.', lesson:'s31'},
 {q:'Hiện tượng mỏi cơ xảy ra chủ yếu là do:', o:['Cơ thể được nghỉ ngơi quá nhiều.','Cơ co liên tục, thiếu oxygen nên sinh ra acid lactic tích tụ đầu độc cơ.','Lượng đường trong máu tăng cao đột ngột.','Các mạch máu co lại làm tăng tốc độ tuần hoàn.'], a:1, why:'Cơ làm việc quá sức, máu không kịp cung cấp đủ oxygen, năng lượng thiếu và acid lactic tích tụ gây mỏi cơ.', lesson:'s31'},
 {q:'Cơ quan nào sau đây không thuộc hệ tiêu hóa của người?', o:['Thực quản.','Dạ dày.','Khí quản.','Ruột non.'], a:2, why:'Khí quản thuộc hệ hô hấp (dẫn khí). Thực quản, dạ dày, ruột non thuộc ống tiêu hóa.', lesson:'s32'},
 {q:'Chất dinh dưỡng nào sau đây bắt đầu được tiêu hóa hóa học ngay tại khoang miệng nhờ enzyme amylase?', o:['Lipid (chất béo).','Protein (chất đạm).','Carbohydrate (tinh bột).','Vitamin và khoáng chất.'], a:2, why:'Enzyme amylase trong nước bọt biến đổi tinh bột chín thành đường maltose ngay ở khoang miệng.', lesson:'s32'}
 ],
 tl:[
 {w:1, q:'Một vật làm bằng gỗ có khối lượng riêng 800 kg/m³. Vật có thể tích 500 cm³.', subs:[
   {l:'a', q:'Tính khối lượng của vật.', a:'Đổi V = 500 cm³ = 5·10⁻⁴ m³.<br>m = D · V = 800 × 5·10⁻⁴ = <b>0,4 kg</b> (= 400 g).', nums:[[0.4,400]], hint:'Đổi 500 cm³ ra m³ trước (1 m³ = 1 000 000 cm³). Công thức m = D·V.', lesson:'l1'},
   {l:'b', q:'Tính trọng lượng của vật.', a:'P = 10 · m = 10 × 0,4 = <b>4 N</b>.', nums:[[4]], hint:'P = 10m (m tính bằng kg).', lesson:'l1'},
   {l:'c', q:'Đặt vật lên mặt sàn nằm ngang, áp suất do vật gây ra lên mặt sàn là 10 000 Pa. Vật hình lập phương. Tính độ dài cạnh của vật?', a:'Áp lực F = P = 4 N. Từ p = F/S ⇒ S = F/p = 4 / 10 000 = 4·10⁻⁴ m² = 4 cm².<br>Cạnh a = √S = <b>2 cm</b> (0,02 m).', nums:[[2,0.02]], hint:'Tìm diện tích S = F/p, rồi lấy căn bậc hai để được cạnh hình vuông.', lesson:'l2'}]},
 {w:1, q:'Tính thể tích ở điều kiện chuẩn (25 °C, 1 bar) của:', subs:[
   {l:'a', q:'0,5 mol khí CO₂.', a:'V = n × 24,79 = 0,5 × 24,79 = <b>12,395 L</b>.', nums:[[12.395]], hint:'V = n × 24,79 (lít).', lesson:'h3'},
   {l:'b', q:'6,4 gam khí O₂.', a:'n = m/M = 6,4/32 = 0,2 mol.<br>V = 0,2 × 24,79 = <b>4,958 L</b>.', nums:[[4.958]], hint:'Tính số mol trước: n = m/M, M(O₂) = 32.', lesson:'h3'}]},
 {w:1, q:'', subs:[
   {l:'a', q:'Khí carbon dioxide (CO₂) nặng hơn hay nhẹ hơn không khí bao nhiêu lần?', a:'M(CO₂) = 44. d = 44/29 ≈ <b>1,52</b>: CO₂ nặng hơn không khí khoảng 1,52 lần.', nums:[[1.52,1.517]], kw:[['nang hon']], hint:'d = M(CO₂)/29.', lesson:'h4'},
   {l:'b', q:'Trong lòng hang sâu thường xảy ra quá trình phân hủy chất vô cơ hoặc hữu cơ, sinh ra khí carbon dioxide. Hãy cho biết khí carbon dioxide tích tụ ở trên nền hang, hay bị không khí đẩy bay lên trên?', a:'CO₂ nặng hơn không khí nên <b>tích tụ ở nền hang</b>, không bị đẩy bay lên trên.', kw:[['nen','duoi','thap','day','mat dat'],['nang hon','nang']], hint:'So sánh khối lượng của CO₂ với không khí vừa tính ở ý a.', lesson:'h4'}]},
 {w:1, q:'Một người nặng 60 kg đứng thẳng bằng hai chân trên sàn nhà. Biết diện tích tiếp xúc của một bàn chân với sàn nhà là 0,015 m². Tính áp suất do người đó tác dụng lên sàn nhà.', subs:[
   {l:'', q:'Áp suất (Pa)', a:'F = P = 10 × 60 = 600 N.<br>Hai bàn chân: S = 2 × 0,015 = 0,03 m².<br>p = F/S = 600/0,03 = <b>20 000 Pa</b>.', nums:[[20000]], hint:'Đứng bằng HAI chân nên S = 2 × 0,015. Áp lực F = trọng lượng = 10m.', lesson:'l2'}]},
 {w:1, q:'', subs:[
   {l:'', q:'Hệ vận động ở người gồm những cơ quan nào? Nêu các biện pháp chống cong vẹo cột sống ở học sinh khi ngồi học.', a:'Hệ vận động gồm <b>xương và cơ</b>.<br>Biện pháp: ngồi học đúng tư thế (lưng thẳng, không gù); bàn ghế phù hợp với chiều cao; không đeo cặp quá nặng hoặc lệch một bên; đủ ánh sáng; tập thể dục thể thao đều đặn; ăn uống đủ chất.', kw:[['xuong'],['co'],['tu the','ngoi dung','ngoi thang','lung thang','ban ghe','cap','the duc','the thao']], hint:'Nhớ 2 cơ quan chính của hệ vận động, rồi kể ít nhất 2 biện pháp (tư thế ngồi, bàn ghế, cặp sách, thể dục…).', lesson:'s31'}]}
 ]},

/* ------------------------------------------------ ĐỀ 2 */
{ id:'gk2', short:'Đề GK 2', title:'Đề kiểm tra giữa kì I – Khoa học tự nhiên 8', sub:'Lý + Hóa + Sinh · 16 trắc nghiệm + 4 tự luận', time:60, tnPts:4, tlPts:6, tag:'Tổng hợp',
 mc:[
 {q:'Khi đun nóng hóa chất lỏng trong cốc thủy tinh phải dùng lưới thép dưới cốc để:', o:['Cốc không bị đổ','Tránh nứt vỡ cốc','Hóa chất không sôi mạnh','Dẫn nhiệt tốt'], a:1, why:'Lưới thép (lưới amiăng) làm nóng đều, tránh cốc bị nóng cục bộ rồi nứt vỡ.', lesson:'h1'},
 {q:'Quá trình nào sau đây xảy ra biến đổi hóa học?', o:['Băng tan','Cồn để trong lọ không kín bị bay hơi','Hòa tan đường vào nước','Cháy rừng'], a:3, why:'Cháy rừng tạo ra chất mới (tro, khói, CO₂…) nên là biến đổi hóa học.', lesson:'h2'},
 {q:'Quá trình nào sau đây là biến đổi vật lí?', o:['Đun nóng đường biến đổi thành than','Rượu để lâu bị chua','Thức ăn bị ôi thiu','Mặt trời lên sương tan dần'], a:3, why:'Sương tan dần chỉ là nước đổi trạng thái (lỏng → hơi), không tạo chất mới.', lesson:'h2'},
 {q:'Công thức liên hệ giữa khối lượng m, thể tích V và khối lượng riêng D của một vật là', o:['D = m.V','m = D.V','V = m.D','m = D/V'], a:1, why:'Từ D = m/V suy ra m = D·V và V = m/D.', lesson:'l1'},
 {q:'Nước đường để lâu bị chua. Dấu hiệu để biết có phản ứng hóa học đã xảy ra là:', o:['Nước đường bị đục hơn','Nước đường có vị chua','Nước đường bị biến đổi màu','Nước đường không thay đổi'], a:1, why:'Vị chua cho thấy đã có chất mới (acid) được tạo ra. Đây là dấu hiệu tạo chất mới có tính chất khác chất ban đầu.', lesson:'h2'},
 {q:'(Vận dụng) Phản ứng tỏa nhiệt, thu nhiệt. Trong quá trình sản xuất và đời sống, các phản ứng tỏa nhiệt KHÔNG có ứng dụng nào?', o:['Cung cấp năng lượng cho động cơ điện','Cung cấp năng lượng cho đun nấu, thắp sáng và sưởi ấm','Cung cấp năng lượng cho vận hành máy móc, phương tiện giao thông: ô tô, xe máy…','Cung cấp năng lượng nhiệt cho các ngành công nghiệp: làm cho các động cơ hay máy phát điện hoạt động'], a:0, why:'Động cơ điện chạy bằng điện năng, không dùng trực tiếp nhiệt từ phản ứng tỏa nhiệt. Ba ứng dụng còn lại đều dùng nhiệt từ đốt cháy nhiên liệu.', lesson:'h2'},
 {q:'Vai trò lưu trữ, xử lí thông tin và dẫn truyền xung thần kinh là của hệ cơ quan nào?', o:['Hệ vận động','Hệ tuần hoàn','Hệ bài tiết','Hệ thần kinh'], a:3, why:'Hệ thần kinh tiếp nhận, xử lí thông tin và điều khiển hoạt động của cơ thể.', lesson:'s30'},
 {q:'Hệ vận động gồm các cơ quan chính là:', o:['Não bộ, tủy sống','Khoang miệng, hầu, thực quản, dạ dày, ruột non, ruột già, hậu môn','Xương, cơ vân','Thận, ống dẫn nước tiểu, bóng đái và ống đái'], a:2, why:'Hệ vận động gồm xương và cơ (cơ vân). A là hệ thần kinh, B là hệ tiêu hóa, D là hệ bài tiết nước tiểu.', lesson:'s31'},
 {q:'Từ thí nghiệm về xương, ta chứng minh được xương có chứa nước và 2 thành phần hóa học là:', o:['Chất hữu cơ và vitamin','Chất vô cơ và muối khoáng','Chất hữu cơ và chất vô cơ','Chất cốt giao và chất hữu cơ'], a:2, why:'Đốt xương → còn chất vô cơ (cứng, giòn). Ngâm xương trong acid → còn chất hữu cơ (mềm, dẻo).', lesson:'s31'},
 {q:'Đơn vị của áp suất là:', o:['N','Pa','m/s','kg'], a:1, why:'Áp suất đo bằng pascal (Pa), 1 Pa = 1 N/m².', lesson:'l2'},
 {q:'Áp lực là', o:['lực ép có phương vuông góc với mặt bị ép.','lực ép có phương song song với mặt bị ép.','lực ép có phương tạo với mặt bị ép một góc bất kì.','lực ép có phương trùng với mặt bị ép.'], a:0, why:'Áp lực là lực ép có phương vuông góc với mặt bị ép.', lesson:'l2'},
 {q:'Mối liên hệ giữa áp lực F, diện tích bị ép S và áp suất p là', o:['p = F.S','S = p.F','p = F/S','F = p/S'], a:2, why:'p = F/S. Suy ra F = p·S và S = F/p.', lesson:'l2'},
 {q:'Áp suất tăng khi', o:['diện tích bị ép S không đổi, áp lực tác dụng lên diện tích bị ép S tăng.','diện tích bị ép S tăng, áp lực tác dụng lên diện tích bị ép S không đổi.','diện tích bị ép S không đổi, áp lực tác dụng lên diện tích bị ép S giảm.','áp lực tăng bao nhiêu lần thì diện tích bị ép S cũng tăng lên bấy nhiêu lần.'], a:0, why:'p = F/S: giữ S, tăng F thì p tăng. Nếu F và S cùng tăng gấp đôi thì p không đổi.', lesson:'l2'},
 {q:'Vì sao cái áo phao không chìm trong nước?', o:['Vì khối lượng của áo phao nhỏ hơn khối lượng của nước.','Vì khối lượng riêng của áo phao nhỏ hơn khối lượng riêng của nước.','Vì áo phao nhẹ.','Vì thể tích của áo phao lớn hơn nước.'], a:1, why:'Vật nổi khi khối lượng riêng của vật nhỏ hơn khối lượng riêng của chất lỏng (D vật < D nước).', lesson:'l3'},
 {q:'Lực đẩy Acsimet có độ lớn phụ thuộc vào', o:['lượng chất lỏng trong bình và khối lượng của vật.','thể tích của phần chất lỏng bị vật chiếm chỗ và bản chất của chất lỏng.','độ sâu của vật bị nhúng chìm so với đáy bình.','khối lượng riêng của vật.'], a:1, why:'F_A = d·V = 10·D·V, với V là thể tích phần chất lỏng bị vật chiếm chỗ, D (hay d) là đặc trưng của chất lỏng.', lesson:'l3'},
 {q:'Cho khối lượng riêng của nhôm, sắt, chì, đá lần lượt là 2700 kg/m³, 7800 kg/m³, 11300 kg/m³, 2600 kg/m³. Một khối đồng chất có thể tích 300 cm³, nặng 810 g, đó là khối', o:['Nhôm','Sắt','Chì','Đá'], a:0, why:'D = m/V = 810/300 = 2,7 g/cm³ = 2 700 kg/m³, trùng với nhôm.', lesson:'l1'}
 ],
 tl:[
 {w:1, q:'Khi cho sodium hydrogen carbonate (NaHCO₃) vào dung dịch acetic acid (CH₃COOH) có hiện tượng sủi bọt khí.', subs:[
   {l:'a', q:'Chỉ ra dấu hiệu của phản ứng?', a:'Có <b>chất khí (bọt khí) thoát ra</b>, sủi bọt.', kw:[['khi','bot','sui']], hint:'Hiện tượng đề bài đã cho: sủi bọt khí.', lesson:'h2'},
   {l:'b', q:'Viết sơ đồ phản ứng bằng chữ? Chỉ ra chất tham gia phản ứng và chất sản phẩm? (Biết rằng sau phản ứng tạo ra sodium acetate (CH₃COONa), nước và carbon dioxide).', a:'sodium hydrogen carbonate + acetic acid → sodium acetate + nước + carbon dioxide.<br>Chất tham gia: sodium hydrogen carbonate, acetic acid.<br>Sản phẩm: sodium acetate, nước, carbon dioxide.', kw:[['hydrogen carbonate','nahco3','natri hidrocacbonat'],['acetic','ch3cooh'],['sodium acetate','ch3coona','natri acetat'],['nuoc','h2o'],['carbon dioxide','co2','cacbon dioxit']], hint:'Chất tham gia nằm bên trái mũi tên (→), sản phẩm bên phải.', lesson:'h2'}]},
 {w:1, q:'', subs:[
   {l:'', q:'Móc 1 quả nặng vào lực kế ở ngoài không khí, lực kế chỉ 30 N. Nhúng chìm quả nặng đó vào trong nước, số chỉ của lực kế thay đổi như thế nào?', a:'Số chỉ lực kế <b>giảm</b> (nhỏ hơn 30 N) vì nước tác dụng lực đẩy Archimedes hướng lên: P₁ = P − F_A.', kw:[['giam','nho hon','it hon']], hint:'Khi nhúng vào nước có thêm lực đẩy hướng lên, ngược chiều trọng lực.', lesson:'l3'}]},

   {l:'b', q:'Từ đó hãy nêu những biện pháp phòng tránh bệnh tật liên quan đến hệ vận động.', a:'Ăn uống đủ chất (calcium, vitamin D); tập thể dục thể thao đều đặn, vừa sức; ngồi học, mang vác đúng tư thế; tắm nắng buổi sáng; tránh chấn thương, khởi động trước khi vận động.', kw:[['an uong','dinh duong','calcium','canxi','vitamin d','tam nang'],['the duc','the thao','tap luyen','van dong','tu the','ngoi dung','mang vac']], hint:'Nghĩ 3 nhóm: ăn uống – tập luyện – tư thế/an toàn.', lesson:'s31'}]},
 {w:1, q:'Một bình kín chứa khí carbon dioxide (CO₂) và khí oxygen (O₂).', subs:[
   {l:'a', q:'Tính khối lượng của 0,25 mol khí CO₂ và thể tích lượng khí này ở điều kiện chuẩn.', a:'m = n·M = 0,25 × 44 = <b>11 g</b>.<br>V = 0,25 × 24,79 = <b>6,1975 L</b> (≈ 6,2 L).', nums:[[11],[6.1975,6.2]], hint:'Hai kết quả: m = n·M (M = 44) và V = n·24,79.', lesson:'h3'},
   {l:'b', q:'Giải thích vì sao khí CO₂ có xu hướng tập trung ở những vị trí thấp hơn trong không khí khi xảy ra hiện tượng rò rỉ khí CO₂ trong phòng kín.', a:'CO₂ có tỉ khối so với không khí d = 44/29 ≈ 1,52 > 1, tức là <b>nặng hơn không khí</b> nên chìm xuống, tập trung ở vị trí thấp.', kw:[['nang hon','44','1,52','1.52','lon hon 1'],['thap','chim','nen','duoi','xuong']], hint:'So sánh M(CO₂) = 44 với 29 của không khí.', lesson:'h4'}]}
 ]},

/* ------------------------------------------------ HÓA 1 */
{ id:'h1', short:'Hóa số 1', title:'Đề kiểm tra giữa kì I KHTN 8 (phần Hóa) – Đề số 1', sub:'Hóa · 6 trắc nghiệm + 3 tự luận', time:30, tnPts:3, tlPts:7, tag:'Hóa',
 mc:[
 {q:'Khi đun nóng hóa chất lỏng trong cốc thủy tinh phải dùng lưới thép dưới cốc để:', o:['Cốc không bị đổ','Hóa chất không sôi mạnh','Tránh nứt vỡ cốc','Dẫn nhiệt tốt'], a:2, why:'Lưới thép giúp cốc thủy tinh nóng đều, tránh nứt vỡ.', lesson:'h1'},
 {q:'Quá trình nào sau đây xảy ra biến đổi hóa học?', o:['Băng tan','Cồn để trong lọ không kín bị bay hơi','Hòa tan đường vào nước','Cháy rừng'], a:3, why:'Cháy rừng tạo chất mới nên là biến đổi hóa học.', lesson:'h2'},
 {q:'Quá trình nào sau đây là biến đổi vật lí?', o:['Đun nóng đường biến đổi thành than','Rượu để lâu bị chua','Thức ăn bị ôi thiu','Mặt trời lên sương tan dần'], a:3, why:'Sương tan là sự đổi trạng thái của nước, không có chất mới.', lesson:'h2'},
 {q:'Nước đường để lâu bị chua. Dấu hiệu để biết có phản ứng hóa học đã xảy ra là:', o:['Nước đường bị đục hơn','Nước đường có vị chua','Nước đường bị biến đổi màu','Nước đường không thay đổi'], a:1, why:'Có chất mới (vị chua) → đã có phản ứng hóa học.', lesson:'h2'},
 {q:'Phản ứng tỏa nhiệt, thu nhiệt. Trong quá trình sản xuất và đời sống, các phản ứng tỏa nhiệt KHÔNG có ứng dụng nào?', o:['Cung cấp năng lượng cho động cơ điện','Cung cấp năng lượng cho đun nấu, thắp sáng và sưởi ấm','Cung cấp năng lượng cho vận hành máy móc, phương tiện giao thông: ô tô, xe máy…','Cung cấp năng lượng nhiệt cho các ngành công nghiệp: làm cho các động cơ hay máy phát điện hoạt động'], a:0, why:'Động cơ điện dùng điện năng, không phải nhiệt từ phản ứng tỏa nhiệt.', lesson:'h2'},
 {q:'Cho các phát biểu sau:<br>1. Cho vôi sống vào nước tạo thành vôi tôi là biến đổi vật lí<br>2. Khi nung nóng đường là phản ứng thu nhiệt<br>3. Sắt tán nhỏ thành đinh là biến đổi vật lí<br>4. Khi đun mỡ quá lửa có mùi khét là biến đổi hóa học<br>Phát biểu đúng là:', o:['1, 3','2, 3, 4','3, 4','4, 2'], a:2, why:'(1) sai: vôi sống + nước tạo vôi tôi là biến đổi hóa học. (2) nung nóng đường cần cấp nhiệt, bản gốc đã sửa thành "thu nhiệt". (3) đúng: tán sắt chỉ đổi hình dạng. (4) đúng: mỡ cháy khét là chất mới. Đáp án của đề: 3, 4.', lesson:'h2', note:'Trong bản scan, phát biểu (2) được bút viết sửa lại thành "thu nhiệt". Đáp án khoanh của đề là C (3, 4).'}
 ],
 tl:[
 {w:1, q:'Trong các hiện tượng sau đây, chỉ ra đâu là hiện tượng vật lý và đâu là hiện tượng hóa học?', subs:[
   {l:'a', q:'Ủ cơm nếp với men rượu trong quá trình lên men rượu. (vật lý hay hóa học?)', a:'<b>Hóa học</b> (tạo ra rượu – chất mới).', kw:[['hoa hoc','hoa li']], hint:'Có tạo ra chất mới (rượu) không?', lesson:'h2'},
   {l:'b', q:'Thanh sắt để lâu ngày trong không khí bị gỉ. (vật lý hay hóa học?)', a:'<b>Hóa học</b> (gỉ sắt là chất mới).', kw:[['hoa hoc','hoa li']], hint:'Gỉ là chất mới, khác sắt ban đầu.', lesson:'h2'},
   {l:'c', q:'Hòa tan đường vào nước. (vật lý hay hóa học?)', a:'<b>Vật lý</b> (đường vẫn là đường, chỉ tan vào nước).', kw:[['vat ly','vat li']], hint:'Đường có biến thành chất khác không?', lesson:'h2'},
   {l:'d', q:'Muối ăn hòa tan vào nước được dung dịch muối ăn. (vật lý hay hóa học?)', a:'<b>Vật lý</b> (chỉ là sự hòa tan, không tạo chất mới).', kw:[['vat ly','vat li']], hint:'Hòa tan thường là hiện tượng vật lý.', lesson:'h2'}]},
 {w:1, q:'', subs:[
   {l:'a', q:'Tính thể tích của 0,15 mol khí CO ở đkc?', a:'V = 0,15 × 24,79 = <b>3,7185 L</b> (≈ 3,72 L).', nums:[[3.7185,3.72]], hint:'V = n × 24,79.', lesson:'h3'},
   {l:'b', q:'Tính khối lượng của 2,5 mol H₂SO₄?', a:'M(H₂SO₄) = 2×1 + 32 + 4×16 = 98 g/mol.<br>m = 2,5 × 98 = <b>245 g</b>.', nums:[[245]], hint:'Tính M(H₂SO₄) trước: H=1, S=32, O=16.', lesson:'h3'}]},
 {w:1, q:'Cho Zinc tác dụng vừa đủ với dung dịch Hydrochloric acid (HCl) tạo thành Zinc chloride (ZnCl₂) và có khí hydrogen thoát ra. Hãy:', subs:[
   {l:'a', q:'Chỉ ra dấu hiệu nhận biết phản ứng hoá học xảy ra?', a:'Có <b>bọt khí (khí hydrogen) thoát ra</b>; kẽm tan dần.', kw:[['khi','bot','sui','thoat']], hint:'Đề cho: "có khí hydrogen thoát ra".', lesson:'h2'},
   {l:'b', q:'Viết phương trình dạng chữ của phản ứng trên.', a:'zinc + hydrochloric acid → zinc chloride + hydrogen.', kw:[['zinc','kem','zn'],['hydrochloric','hcl'],['zinc chloride','zncl2'],['hydrogen','h2']], hint:'Chất tham gia: zinc, hydrochloric acid. Sản phẩm: zinc chloride, hydrogen.', lesson:'h2'}]}
 ]},

{ id:'h2', short:'Hóa số 2', title:'Đề kiểm tra giữa kì I KHTN 8 (phần Hóa) – Đề số 2', sub:'Hóa · 8 trắc nghiệm + 2 tự luận', time:30, tnPts:4, tlPts:6, tag:'Hóa',
 mc:[
 {q:'Dụng cụ thí nghiệm nào dùng để lấy dung dịch hóa chất lỏng?', o:['Kẹp gỗ.','Bình tam giác.','Ống nghiệm.','Ống hút nhỏ giọt.'], a:3, why:'Ống hút nhỏ giọt dùng lấy một lượng nhỏ hóa chất lỏng.', lesson:'h1'},
 {q:'Khi đun nóng hoá chất trong ống nghiệm cần kẹp ống nghiệm bằng kẹp ở khoảng bao nhiêu so với ống nghiệm tính từ miệng ống?', o:['1/2','1/4','1/6','1/3'], a:3, why:'Kẹp ống nghiệm ở khoảng 1/3 chiều dài tính từ miệng ống.', lesson:'h1'},
 {q:'Thiết bị cung cấp điện là', o:['Pin 1,5 V.','Ampe kế.','Vôn kế.','Công tắc.'], a:0, why:'Pin, ắc quy, biến áp nguồn là thiết bị cung cấp điện. Ampe kế, vôn kế là thiết bị đo; công tắc là thiết bị đóng ngắt.', lesson:'h1'},
 {q:'Dấu hiệu nhận ra có chất mới tạo thành là', o:['Sự thay đổi về màu sắc.','Xuất hiện chất khí.','Xuất hiện kết tủa.','Cả 3 dấu hiệu trên.'], a:3, why:'Đổi màu, tạo chất khí, tạo kết tủa… đều có thể là dấu hiệu có chất mới.', lesson:'h2'},
 {q:'Mol là gì?', o:['Là khối lượng ban đầu của chất đó','Là khối lượng sau khi tham gia phản ứng hóa học','Bằng 6.10²³','Là lượng chất có chứa N_A (6,022.10²³) nguyên tử hoặc phân tử chất đó'], a:3, why:'1 mol chứa 6,022·10²³ hạt (nguyên tử, phân tử…).', lesson:'h3'},
 {q:'Thể tích mol là', o:['Là thể tích của chất lỏng','Thể tích của 1 nguyên tử nào đó','Thể tích chiếm bởi N_A phân tử của chất khí đó','Thể tích ở đktc là 22,4 l'], a:2, why:'Thể tích mol của chất khí là thể tích chiếm bởi N_A phân tử (1 mol) chất khí đó. Ở đkc (25 °C, 1 bar) là 24,79 L.', lesson:'h3'},
 {q:'Nồng độ phần trăm của một dung dịch cho ta biết', o:['số mol chất tan trong một lít dung dịch.','số gam chất tan có trong 100 gam dung dịch.','số mol chất tan có trong 150 gam dung dịch.','số gam chất tan có trong dung dịch.'], a:1, why:'C% = (m chất tan / m dung dịch) × 100%: số gam chất tan trong 100 g dung dịch.', lesson:'h3'},
 {q:'Quá trình nào sau đây thể hiện sự biến đổi vật lí?', o:['Gỗ cháy thành than.','Đun nóng đường đến khi xuất hiện chất màu đen.','Cơm bị ôi thiu.','Hòa tan đường ăn vào nước.'], a:3, why:'Hòa tan đường vào nước không tạo chất mới.', lesson:'h2'}
 ],
 tl:[
 {w:1, q:'Khi cho sodium hydrogen carbonate (NaHCO₃) vào dung dịch acetic acid (CH₃COOH) có hiện tượng sủi bọt khí.', subs:[
   {l:'a', q:'Chỉ ra dấu hiệu của phản ứng?', a:'Có <b>chất khí (bọt khí) thoát ra</b>.', kw:[['khi','bot','sui']], hint:'Hiện tượng: sủi bọt khí.', lesson:'h2'},
   {l:'b', q:'Viết sơ đồ phản ứng bằng chữ? Chỉ ra chất tham gia phản ứng và chất sản phẩm? (Biết rằng sau phản ứng tạo ra sodium acetate (CH₃COONa), nước và carbon dioxide).', a:'sodium hydrogen carbonate + acetic acid → sodium acetate + nước + carbon dioxide.<br>Chất tham gia: sodium hydrogen carbonate, acetic acid. Sản phẩm: sodium acetate, nước, carbon dioxide.', kw:[['hydrogen carbonate','nahco3','natri hidrocacbonat'],['acetic','ch3cooh'],['sodium acetate','ch3coona','natri acetat'],['nuoc','h2o'],['carbon dioxide','co2','cacbon dioxit']], hint:'Trái mũi tên = chất tham gia; phải = sản phẩm.', lesson:'h2'}]},
 {w:1, q:'', subs:[
   {l:'', q:'Xác định khối lượng mol của khí A biết tỉ khối của khí A so với khí B là 1,8 và khối lượng mol của khí B là 30.', a:'d(A/B) = M_A / M_B = 1,8 ⇒ M_A = 1,8 × 30 = <b>54 g/mol</b>.', nums:[[54]], hint:'d(A/B) = M_A / M_B.', lesson:'h4'}]}
 ]},

{ id:'h3', short:'Hóa số 3', title:'Đề kiểm tra giữa kì I KHTN 8 (phần Hóa) – Đề số 3', sub:'Hóa · 8 trắc nghiệm + 2 tự luận', time:30, tnPts:4, tlPts:6, tag:'Hóa',
 mc:[
 {q:'Dụng cụ nào dưới đây dùng để chứa hóa chất lượng nhỏ?', o:['Bình cầu','Cốc thủy tinh.','Ống đong.','Ống nghiệm.'], a:3, why:'Ống nghiệm dùng chứa lượng nhỏ hóa chất để làm thí nghiệm.', lesson:'h1'},
 {q:'Chọn đáp án đúng cho ý nghĩa của kí hiệu sau.', o:['Cảnh báo khu vực hay có sét đánh','Nguy hiểm về điện','Khu vực có chất độc sinh học','Cảnh báo chất độc'], a:1, why:'Biển tam giác vàng có tia chớp là cảnh báo nguy hiểm về điện.', fig:'electric', lesson:'h1'},
 {q:'Quá trình biến đổi hóa học là', o:['quá trình mà chất chỉ chuyển từ trạng thái này sang trạng thái khác, không tạo thành chất mới.','quá trình chất biến đổi có sự tạo thành chất mới.','quá trình chất biến đổi có sự tạo thành chất mới hoặc không tạo thành chất mới.','quá trình chất không biến đổi và không có sự hình thành chất mới.'], a:1, why:'Biến đổi hóa học (phản ứng hóa học) luôn tạo ra chất mới.', lesson:'h2'},
 {q:'Bản chất của phản ứng hóa học là sự thay đổi về', o:['số lượng nguyên tử mỗi nguyên tố.','số lượng các nguyên tố.','số lượng các phân tử.','liên kết giữa các nguyên tử.'], a:3, why:'Trong phản ứng, liên kết giữa các nguyên tử bị phá vỡ rồi hình thành liên kết mới. Số nguyên tử mỗi nguyên tố được giữ nguyên.', lesson:'h2'},
 {q:'Trong quá trình sản xuất và đời sống, các phản ứng tỏa nhiệt KHÔNG có ứng dụng nào?', o:['Cung cấp năng lượng cho động cơ điện','Cung cấp năng lượng cho đun nấu, thắp sáng và sưởi ấm','Cung cấp năng lượng cho vận hành máy móc, phương tiện giao thông: ô tô, xe máy…','Cung cấp năng lượng nhiệt cho các ngành công nghiệp: làm cho các động cơ hay máy phát điện hoạt động'], a:0, why:'Động cơ điện chạy bằng điện năng.', lesson:'h2'},
 {q:'Số mol nguyên tử Zn tương ứng 3,0.10²³ nguyên tử Zn là', o:['0,2 mol.','0,3 mol.','0,5 mol.','0,6 mol'], a:2, why:'n = số hạt / (6·10²³) = 3,0·10²³ / 6·10²³ = 0,5 mol.', lesson:'h3'},
 {q:'Có thể thu khí N₂ bằng cách nào?', o:['Đặt đứng bình.','Đặt úp bình.','Đặt ngang bình.','Cách nào cũng được.'], a:1, why:'M(N₂) = 28 < 29 nên N₂ nhẹ hơn không khí, bay lên trên. Muốn thu khí nhẹ hơn không khí phải đặt úp bình để khí dồn lên đáy bình.', lesson:'h4'},
 {q:'Enzim trong nước bọt hoạt động tốt nhất trong điều kiện pH và nhiệt độ nào?', o:['pH = 5 và t = 37 °C.','pH = 7,2 và t = 37 °C.','pH = 7 và t = 31,9 °C.','pH = 8 và t = 32,6 °C.'], a:1, why:'Enzyme amylase trong nước bọt hoạt động tốt nhất ở pH ≈ 7,2 và nhiệt độ cơ thể 37 °C.', lesson:'s32'}
 ],
 tl:[
 {w:1, q:'Xét các hiện tượng sau đây, hiện tượng nào là hiện tượng vật lý, hiện tượng nào là hiện tượng hóa học?', subs:[
   {l:'a', q:'Hòa tan vôi sống (CaO) vào nước. (vật lý hay hóa học?)', a:'<b>Hóa học</b> (tạo vôi tôi Ca(OH)₂, tỏa nhiều nhiệt).', kw:[['hoa hoc','hoa li']], hint:'Vôi sống + nước tạo vôi tôi (chất mới).', lesson:'h2'},

   {l:'c', q:'Thức ăn để lâu bị ôi thiu. (vật lý hay hóa học?)', a:'<b>Hóa học</b> (tạo chất mới có mùi, vị khác).', kw:[['hoa hoc','hoa li']], hint:'Ôi thiu: có mùi lạ, chất mới.', lesson:'h2'},
   {l:'d', q:'Hoà tan muối ăn vào nước tạo thành nước muối. (vật lý hay hóa học?)', a:'<b>Vật lý</b> (chỉ là sự hòa tan).', kw:[['vat ly','vat li']], hint:'Hòa tan không tạo chất mới.', lesson:'h2'}]},
 {w:1, q:'', subs:[
   {l:'a', q:'Tính khối lượng của 3,875 lít khí CO₂ ở đkc?', a:'n = 3,875 / 24,79 ≈ 0,156 mol.<br>m = 0,156 × 44 ≈ <b>6,88 g</b>.', nums:[[6.88,6.87,6.9]], hint:'n = V/24,79 rồi m = n·M, M(CO₂) = 44.', lesson:'h3'},
   {l:'b', q:'Tính thể tích của 3,011.10²³ phân tử O₂?', a:'n = 3,011·10²³ / 6,022·10²³ = 0,5 mol.<br>V = 0,5 × 24,79 = <b>12,395 L</b>.', nums:[[12.395,12.4]], hint:'Số mol = số hạt / 6,022·10²³, rồi V = n·24,79.', lesson:'h3'},
   {l:'c', q:'Vì sao người ta thường nạp khí H₂ vào bóng bay hay khinh khí cầu?', a:'H₂ có M = 2, d = 2/29 ≈ 0,07 < 1, tức <b>nhẹ hơn không khí</b> rất nhiều nên bóng bay lên được.', kw:[['nhe hon','nhe'],['khong khi']], hint:'So sánh khối lượng mol của H₂ (2) với không khí (29).', lesson:'h4'}]}
 ]},

/* ------------------------------------------------ HÓA 4 */
{ id:'h4', short:'Hóa số 4', title:'Đề kiểm tra giữa kì I KHTN 8 (phần Hóa) – Đề số 4', sub:'Hóa · 8 trắc nghiệm (4 điểm) + 3 tự luận', time:30, tnPts:4, tlPts:6, tag:'Hóa',
 mc:[
 {q:'Dụng cụ ở hình bên có tên gọi là gì và thường dùng để làm gì?', o:['Pipette, dùng lấy hóa chất.','Bơm tiêm, dùng truyền hóa chất cho cây.','Bơm hóa chất, dùng để làm thí nghiệm.','Bơm khí dùng để bơm không khí vào ống nghiệm.'], a:0, why:'Đó là pipette (ống hút nhỏ giọt) dùng lấy một lượng nhỏ hóa chất lỏng.', fig:'pipette', lesson:'h1'},
 {q:'Cách bảo quản hóa chất trong phòng thí nghiệm:', o:['Hóa chất trong phòng thí nghiệm thường đựng trong lọ có dán nhãn ghi tên hóa chất.','Hóa chất dùng xong nếu còn thừa, phải đổ trở lại bình chứa.','Hóa chất trong phòng thí nghiệm thường đựng trong lọ có nút đậy kín, phía ngoài có dán nhãn ghi tên hóa chất.','Nếu hóa chất có tính độc hại không cần ghi chú trên nhãn riêng nhưng phải đặt ở khu vực riêng'], a:2, why:'Lọ phải đậy kín và có nhãn. Không đổ hóa chất thừa trở lại bình chứa; hóa chất độc hại cần ghi chú trên nhãn.', lesson:'h1'},
 {q:'Biện pháp an toàn khi sử dụng điện là:', o:['Sử dụng dây dẫn không có vỏ bọc cách điện; kiểm tra cách điện của đồ dùng điện; nối đất các thiết bị, đồ dùng điện.','Thực hiện tốt cách điện dây dẫn điện, kiểm tra cách điện của đồ dùng điện; sử dụng đồ dùng điện với hiệu điện thế 380V.','Thực hiện tốt cách điện dây dẫn điện; kiểm tra cách điện của đồ dùng điện; không sử dụng đồ dùng điện có vỏ bằng kim loại.','Thực hiện tốt cách điện dây dẫn điện; kiểm tra cách điện của đồ dùng điện; nối đất các thiết bị, đồ dùng điện.'], a:3, why:'An toàn điện: cách điện tốt dây dẫn, kiểm tra cách điện đồ dùng và nối đất thiết bị. Dây không vỏ bọc, hiệu điện thế 380 V hay cấm đồ vỏ kim loại đều không đúng. (Bản scan khoanh C, đáp án chuẩn là D.)', lesson:'h1'},
 {q:'Biến đổi hóa học là', o:['chất biến đổi mà vẫn giữ nguyên là chất ban đầu.','chất biến đổi có tạo ra chất khác.','chất bị biến đổi về trạng thái, màu sắc.','chất bị hòa tan trong nước.'], a:1, why:'Biến đổi hóa học: chất biến đổi tạo ra chất khác.', lesson:'h2'},
 {q:'Quá trình đốt cháy dầu là phản ứng toả nhiệt được ứng dụng để:', o:['đun nấu, sưởi ấm, nung gốm sứ.','chạy động cơ, đun nấu.','hàn cắt kim loại, để chạy động cơ.','đun nấu, sưởi ấm, hàn cắt kim loại.'], a:0, why:'Nhiệt tỏa ra khi đốt dầu được dùng để đun nấu, sưởi ấm, nung gốm sứ. (Trên bản scan, A được khoanh và D bị gạch.)', lesson:'h2'},
 {q:'Biến đổi nào sau đây là biến đổi hóa học?', o:['Cơm bị ôi thiu.','Rửa rau bằng nước lạnh.','Cầu vồng xuất hiện sau mưa.','Hoà tan muối ăn vào nước.'], a:0, why:'Cơm ôi thiu có chất mới → biến đổi hóa học. Các hiện tượng còn lại không tạo chất mới.', lesson:'h2'},
 {q:'Khi thổi hơi thở vào dung dịch calcium hydroxide (nước vôi trong). Hiện tượng quan sát được trong ống nghiệm chứa dung dịch calcium hydroxide là', o:['dung dịch chuyển màu đỏ.','dung dịch không có hiện tượng.','dung dịch bị vẩn đục.','dung dịch chuyển màu xanh.'], a:2, why:'Hơi thở chứa CO₂. CO₂ + nước vôi trong → calcium carbonate (CaCO₃) không tan nên nước vôi bị vẩn đục.', lesson:'h2'},
 {q:'Phản ứng thu nhiệt là phản ứng hoá học có sự cung cấp nhiệt cho phản ứng. Trong các quá trình sau, quá trình nào xảy ra phản ứng thu nhiệt?', o:['Phản ứng đốt cháy xăng dầu trong động cơ tạo ra năng lượng dưới dạng nhiệt để vận hành xe cộ, máy móc,..','Khi sản xuất vôi, người ta phải liên tục cung cấp nhiệt để thực hiện phản ứng phân hủy đá vôi.','Phản ứng khi cho một ít vôi sống vào cốc nước, vôi sống trở nên dẻo quánh và thấy cốc nước nóng lên.','Quá trình hô hấp tạo ra phản ứng tỏa nhiệt bên trong các tế bào trong quá trình trao đổi khí.'], a:1, why:'Sản xuất vôi phải liên tục cung cấp nhiệt để phân hủy đá vôi: phản ứng thu nhiệt. Ba trường hợp còn lại đều tỏa nhiệt. (Bản scan khoanh C nhưng C là phản ứng tỏa nhiệt.)', lesson:'h2'}
 ],
 tl:[
 {w:1, q:'', subs:[
   {l:'', q:'Nêu chức năng của các thiết bị sau: máy đo pH, ampe kế, vôn kế, huyết áp kế?', a:'Máy đo pH: đo độ pH của dung dịch/môi trường.<br>Ampe kế: đo cường độ dòng điện.<br>Vôn kế: đo hiệu điện thế (điện áp).<br>Huyết áp kế: đo huyết áp.', kw:[['ph'],['cuong do','dong dien'],['hieu dien the','dien ap'],['huyet ap']], hint:'4 thiết bị = 4 ý: pH / dòng điện / hiệu điện thế / huyết áp.', lesson:'h1'}]},
 {w:1, q:'', subs:[
   {l:'a', q:'Khí CH₄, O₂, H₂, CO₂ khí nào nặng hơn không khí?', a:'M: CH₄ = 16, O₂ = 32, H₂ = 2, CO₂ = 44. Khí nặng hơn không khí (M > 29) là <b>O₂ và CO₂</b>.', kw:[['o2','oxygen','oxi'],['co2','carbon dioxide','cacbon dioxit']], hint:'Tính M của từng khí rồi so với 29.', lesson:'h4'},
   {l:'b', q:'Tính khối lượng (gam) của 7,437 L khí SO₂, khí được đo ở đkc.', a:'n = 7,437/24,79 = 0,3 mol.<br>M(SO₂) = 32 + 2×16 = 64.<br>m = 0,3 × 64 = <b>19,2 g</b>.', nums:[[19.2]], hint:'n = V/24,79 = 0,3 mol; M(SO₂) = 64.', lesson:'h3'}]},
 {w:1, q:'', subs:[
   {l:'', q:'Xác định tên gọi của chất A, biết ở điều kiện thường A tồn tại ở trạng thái khí có công thức là A₂, tỉ khối của A₂ so với khí oxygen là 5.', a:'d(A₂/O₂) = M(A₂)/32 = 5 ⇒ M(A₂) = 160 ⇒ M(A) = 160/2 = <b>80</b> ⇒ A là bromine (Br).<br><i>Lưu ý: đề gốc cho dữ kiện như vậy; thực tế Br₂ ở điều kiện thường là chất lỏng.</i>', nums:[[160],[80]], kw:[['brom','br']], hint:'M(A₂) = 5 × 32. Sau đó chia 2 để ra M(A) và tra bảng nguyên tử khối.', lesson:'h4', anyOf:true}]}
 ]},

/* ------------------------------------------------ HÓA 5 */
{ id:'h5', short:'Hóa số 5', title:'Đề kiểm tra giữa kì I KHTN 8 (phần Hóa) – Đề số 5', sub:'Hóa · 8 trắc nghiệm + 2 tự luận', time:30, tnPts:4, tlPts:6, tag:'Hóa',
 mc:[
 {q:'Khi đun nóng hóa chất lỏng trong cốc thủy tinh phải dùng lưới thép dưới cốc để:', o:['Cốc không bị đổ.','Hóa chất không sôi mạnh.','Tránh nứt vỡ cốc.','Dẫn nhiệt tốt.'], a:2, why:'Lưới thép làm cốc nóng đều, tránh nứt vỡ.', lesson:'h1'},
 {q:'Quá trình nào sau đây xảy ra biến đổi hóa học?', o:['Băng tan','Cồn để trong lọ không kín bị bay hơi','Hòa tan đường vào nước','Cháy rừng'], a:3, why:'Cháy rừng tạo chất mới.', lesson:'h2'},
 {q:'Nước đường để lâu bị chua. Dấu hiệu để biết có phản ứng hóa học đã xảy ra là:', o:['Nước đường bị đục hơn','Nước đường có vị chua','Nước đường không thay đổi','Nước đường bị biến đổi màu'], a:1, why:'Vị chua = chất mới được tạo ra.', lesson:'h2'},
 {q:'Cho các phát biểu sau:<br>(1) Cho vôi sống vào nước tạo thành vôi tôi là biến đổi vật lí<br>(2) Khi nung nóng đường là phản ứng tỏa nhiệt<br>(3) Sắt tán nhỏ thành đinh là biến đổi vật lí<br>(4) Khi đun mỡ quá lửa có mùi khét là biến đổi hóa học<br>Số phát biểu đúng là:', o:['1','2','3','4'], a:1, why:'(1) sai: là biến đổi hóa học. (2) sai: nung đường cần cung cấp nhiệt nên là thu nhiệt. (3) đúng. (4) đúng. Có 2 phát biểu đúng.', lesson:'h2'},
 {q:'Kí hiệu cảnh báo dưới đây được in trên nhãn chai hoá chất. Kí hiệu này có nghĩa là', o:['hoá chất dễ cháy.','hoá chất độc với môi trường.','hoá chất kích ứng đường hô hấp.','hoá chất gây hại cho sức khoẻ.'], a:0, why:'Biểu tượng ngọn lửa là cảnh báo hóa chất dễ cháy (ngọn lửa trên vòng tròn là hóa chất có tính oxi hóa, gây cháy). Theo đáp án của đề chọn A.', fig:'oxidizer', lesson:'h1'},
 {q:'Trong phản ứng tổng hợp ammonia từ nitrogen và hydrogen, các liên kết giữa các nguyên tử …(1)… bị phá vỡ, liên kết giữa các nguyên tử …(2)… được hình thành.<br><i>nitrogen (N₂) + hydrogen (H₂) → ammonia (NH₃)</i><br>Các từ thích hợp để điền vào vị trí (1), (2) lần lượt là:', o:['cùng loại, cùng loại.','khác loại, khác loại.','khác loại, cùng loại.','cùng loại, khác loại.'], a:3, why:'Ở chất đầu, liên kết N–N, H–H giữa các nguyên tử cùng loại bị phá vỡ. Ở sản phẩm NH₃, liên kết N–H giữa các nguyên tử khác loại được hình thành.', lesson:'h2'},
 {q:'Đâu không phải nút chức năng trên thiết bị Joulemeter là?', o:['Nút start để khởi động.','Nút on để bật','Nút reset để cài lại.','Nút cài đặt để lựa chọn'], a:3, why:'Joulemeter có các nút: on/off, start, reset. Không có "nút cài đặt để lựa chọn".', lesson:'h1'},
 {q:'Đâu là thiết bị hỗ trợ điện', o:['Biến trở.','Bóng đèn pin kèm đui 3V','Điot phát quang','Công tắc'], a:3, why:'Theo bài 1 (KHTN 8): công tắc là thiết bị hỗ trợ (đóng ngắt mạch). Biến trở, bóng đèn, điot là thiết bị tiêu thụ/điều chỉnh trong mạch.', lesson:'h1'}
 ],
 tl:[
 {w:1, q:'', subs:[
   {l:'a1', q:'Khí sulfur dioxide (SO₂) nặng hay nhẹ hơn không khí bao nhiêu lần?', a:'M(SO₂) = 64 ⇒ d = 64/29 ≈ <b>2,21</b>: SO₂ nặng hơn không khí khoảng 2,21 lần.', nums:[[2.21,2.2]], hint:'d = M/29, M(SO₂) = 64.', lesson:'h4'},
   {l:'a2', q:'Khí methane (CH₄) nặng hay nhẹ hơn không khí bao nhiêu lần?', a:'M(CH₄) = 16 ⇒ d = 16/29 ≈ <b>0,55</b>: CH₄ nhẹ hơn không khí (bằng khoảng 0,55 lần).', nums:[[0.55]], kw:[['nhe']], hint:'d = 16/29.', lesson:'h4'},
   {l:'b', q:'Lưu huỳnh cháy trong oxi không khí tạo ra chất khí mùi hắc (sulfur dioxide). Chỉ ra dấu hiệu của phản ứng và viết phương trình chữ.', a:'Dấu hiệu: <b>có chất khí mùi hắc</b> (sulfur dioxide) sinh ra.<br>sulfur + oxygen → sulfur dioxide.', kw:[['khi','mui hac'],['sulfur','luu huynh','s '],['oxygen','oxi','o2'],['sulfur dioxide','so2']], hint:'Dấu hiệu là chất khí có mùi hắc. Chất đầu: sulfur, oxygen.', lesson:'h2'}]},
 {w:1, q:'', subs:[
   {l:'a', q:'Ở đkc 0,5 lít khí X có khối lượng là 0,48 gam. Khối lượng mol phân tử của khí X là bao nhiêu?', a:'n = 0,5/24,79 ≈ 0,0202 mol.<br>M = m/n = 0,48 / 0,0202 ≈ <b>24 g/mol</b> (23,8).', nums:[[24,23.8,23.79]], hint:'n = V/24,79 rồi M = m/n.', lesson:'h3'},
   {l:'b', q:'0,35 mol khí SO₂ ở điều kiện chuẩn có thể tích bằng bao nhiêu?', a:'V = 0,35 × 24,79 = <b>8,6765 L</b> (≈ 8,68 L).', nums:[[8.6765,8.68]], hint:'V = n × 24,79.', lesson:'h3'}]}
 ]},

/* ------------------------------------------------ TEAM CÔ OANH */
{ id:'oanh', short:'Đề cô Oanh', title:'Đề kiểm tra Khoa học tự nhiên 8 – Team cô Oanh', sub:'Hóa · 4 trắc nghiệm (2 điểm) + 3 tự luận (8 điểm)', time:30, tnPts:2, tlPts:8, tag:'Hóa',
 mc:[
 {q:'Khi sử dụng hóa chất trong phòng thực hành, học sinh cần thực hiện việc nào sau đây?', o:['Nếm thử hóa chất để nhận biết.','Ngửi trực tiếp hóa chất để xác định mùi.','Đọc kĩ nhãn hóa chất và tuân thủ hướng dẫn an toàn.','Tự ý trộn các hóa chất với nhau.'], a:2, why:'Luôn đọc nhãn và tuân thủ hướng dẫn an toàn. Không nếm, không ngửi trực tiếp, không tự ý trộn hóa chất.', lesson:'h1'},
 {q:'Hiện tượng nào sau đây là dấu hiệu cho thấy có thể đã xảy ra phản ứng hóa học?', o:['Nước đá tan thành nước lỏng.','Đường được nghiền thành bột mịn.','Nước bay hơi khi đun nóng.','Xuất hiện chất khí khi cho viên sủi vào nước.'], a:3, why:'Xuất hiện chất khí (bọt khí) là dấu hiệu có chất mới. Ba hiện tượng còn lại là biến đổi vật lí.', lesson:'h2'},
 {q:'Quá trình nào sau đây là phản ứng tỏa nhiệt?', o:['Nước đá tan thành nước.','Đốt cháy than trong không khí.','Nước lỏng hóa hơi.','Làm nóng một cốc nước bằng bếp điện.'], a:1, why:'Đốt than là phản ứng cháy, tỏa nhiệt. Các quá trình khác không phải phản ứng hóa học.', lesson:'h2'},
 {q:'Phát biểu nào sau đây đúng về mol?', o:['Mol là đơn vị đo thể tích chất khí.','Mol là đơn vị đo khối lượng chất.','Mol là đơn vị dùng để đo lượng chất.','Mol chỉ được dùng để biểu diễn lượng chất lỏng.'], a:2, why:'Mol là đơn vị đo lượng chất (1 mol chứa 6,022·10²³ hạt).', lesson:'h3'}
 ],
 tl:[
 {w:2.5, q:'Đốt cháy magnesium (Mg) trong khí oxygen (O₂), tạo thành magnesium oxide (MgO), đồng thời phát ra ánh sáng chói và tỏa nhiều nhiệt.', subs:[
   {l:'a', q:'Viết phương trình chữ của phản ứng hóa học trên.', a:'magnesium + oxygen → magnesium oxide.', kw:[['magnesium','magie','mg'],['oxygen','oxi','o2'],['magnesium oxide','mgo','magie oxit']], hint:'Chất tham gia: Mg và O₂. Sản phẩm: MgO.', lesson:'h2'},
   {l:'b', q:'Phản ứng trên là phản ứng tỏa nhiệt hay thu nhiệt? Giải thích.', a:'Là phản ứng <b>tỏa nhiệt</b> vì phản ứng phát ra ánh sáng chói và tỏa nhiều nhiệt ra môi trường xung quanh.', kw:[['toa nhiet'],['nhiet','anh sang','toa']], hint:'Đề nói "tỏa nhiều nhiệt".', lesson:'h2'},
   {l:'c', q:'Nêu một dấu hiệu chứng tỏ phản ứng hóa học đã xảy ra.', a:'Phát ra ánh sáng chói và tỏa nhiều nhiệt; tạo chất rắn màu trắng (MgO).', kw:[['anh sang','toa nhiet','nhiet','chat ran','trang','phat sang','chay']], hint:'Quan sát: ánh sáng, nhiệt, chất mới…', lesson:'h2'}]},
 {w:3.5, q:'', subs:[
   {l:'a', q:'Tính khối lượng của 0,3 mol H₂SO₄.', a:'M(H₂SO₄) = 2×1 + 32 + 4×16 = 98 g/mol.<br>m = 0,3 × 98 = <b>29,4 g</b>.', nums:[[29.4]], hint:'m = n × M, M = 98.', lesson:'h3'},

 <li><b>Ống nghiệm</b>: chứa lượng nhỏ hóa chất để làm phản ứng.</li>

 <li><b>Ống đong</b>: đo thể tích chất lỏng. <b>Cốc thủy tinh, bình tam giác</b>: chứa, pha, đun hóa chất.</li>
 <li><b>Đèn cồn</b>: đun nóng. <b>Kẹp ống nghiệm</b>: kẹp ở khoảng <b>1/3 từ miệng ống</b>.</li>
 <li><b>Lưới thép</b> đặt dưới cốc khi đun: làm nóng đều, <b>tránh nứt vỡ cốc</b>.</li></ul>
 <p class="tip">Mẹo nhớ: ống hút = <b>lấy</b>, ống đong = <b>đo</b>, ống nghiệm = <b>chứa</b>.</p>`,
  chk:{q:'Dụng cụ nào dùng để lấy một lượng nhỏ hóa chất lỏng?', o:['Ống đong','Ống hút nhỏ giọt','Kẹp ống nghiệm','Lưới thép'], a:1, why:'Ống hút nhỏ giọt (pipette) dùng để lấy lượng nhỏ hóa chất lỏng.'}},

{id:'h2', s:'hoa', n:'Bài 2', title:'Phản ứng hóa học', goal:'Phân biệt biến đổi vật lí/hóa học, nhận biết phản ứng, tỏa/thu nhiệt, viết phương trình chữ.',
 steps:[
 {h:'Biến đổi vật lí và biến đổi hóa học', html:`<div class="two"><div><h4>Vật lí</h4><p>Chỉ đổi <b>trạng thái, hình dạng, hòa tan</b>. <b>Không tạo chất mới.</b></p><p>VD: băng tan, cồn bay hơi, hòa tan đường/muối, tán sắt thành đinh, sương tan.</p></div>
 <div><h4>Hóa học</h4><p><b>Có chất mới</b> tạo thành (phản ứng hóa học).</p><p>VD: cháy rừng, sắt gỉ, thức ăn ôi thiu, rượu bị chua, lên men, đốt gỗ, vôi sống + nước.</p></div></div>
 <p class="tip">Câu hỏi vàng: <b>“Có chất mới không?”</b> Có → hóa học. Không → vật lí.</p>`,
  chk:{q:'Hiện tượng nào là biến đổi hóa học?', o:['Băng tan','Hòa tan muối vào nước','Thanh sắt để lâu bị gỉ','Cồn bay hơi'], a:2, why:'Gỉ sắt tạo chất mới.'}},
 {h:'Phản ứng hóa học & phương trình chữ', html:`<p>Phản ứng hóa học: quá trình biến đổi <b>chất này thành chất khác</b>. Chất ban đầu = <b>chất tham gia (chất phản ứng)</b>; chất mới = <b>sản phẩm</b>.</p>
 <div class="eq">chất tham gia &nbsp;→&nbsp; sản phẩm</div>
 <p>Ví dụ: <b>magnesium + oxygen → magnesium oxide</b>.</p>
 <p><b>Bản chất:</b> liên kết giữa các nguyên tử bị <b>phá vỡ</b> rồi <b>hình thành liên kết mới</b>; số nguyên tử mỗi nguyên tố được giữ nguyên.</p>
 <p>Ví dụ NaHCO₃ + CH₃COOH: sodium hydrogen carbonate + acetic acid → sodium acetate + nước + carbon dioxide.</p>`,
  chk:{q:'Trong “zinc + hydrochloric acid → zinc chloride + hydrogen”, sản phẩm là:', o:['zinc, hydrochloric acid','zinc chloride, hydrogen','zinc, hydrogen','hydrochloric acid, zinc chloride'], a:1, why:'Sản phẩm đứng bên phải mũi tên.'}},
 {h:'Dấu hiệu nhận biết phản ứng', html:`<ul><li>Có <b>chất khí</b> thoát ra (sủi bọt).</li><li>Có <b>chất kết tủa</b> (chất rắn không tan).</li><li><b>Đổi màu</b>, đổi mùi vị (vị chua…).</li><li>Phát sáng, tỏa/thu nhiệt.</li></ul>
 <p>VD: thổi hơi thở vào nước vôi trong → <b>vẩn đục</b> (CO₂ + Ca(OH)₂ → CaCO₃ không tan).</p>
 <p>Lưu huỳnh cháy → chất khí <b>mùi hắc</b> (SO₂).</p>`,
  chk:{q:'Cho viên sủi vào nước thấy bọt khí. Đó là dấu hiệu:', o:['Chỉ là hòa tan','Có phản ứng hóa học (tạo chất khí)','Biến đổi vật lí','Không có gì'], a:1, why:'Bọt khí là chất mới sinh ra.'}},
 {h:'Phản ứng tỏa nhiệt và thu nhiệt', html:`<div class="two"><div><h4>Tỏa nhiệt</h4><p>Giải phóng nhiệt ra môi trường.</p><p>Đốt than, gas, xăng dầu; vôi sống + nước; hô hấp tế bào; Mg cháy.</p><p>Ứng dụng: đun nấu, sưởi ấm, chạy động cơ nhiệt, hàn cắt kim loại.</p></div>
 <div><h4>Thu nhiệt</h4><p>Phải <b>liên tục cung cấp nhiệt</b>.</p><p>Nung đá vôi CaCO₃, nhiệt phân đường, nung KMnO₄.</p></div></div>
 <p class="tip">Động cơ điện chạy bằng điện năng nên không phải ứng dụng của phản ứng tỏa nhiệt.</p>`,
  chk:{q:'Phản ứng nào thu nhiệt?', o:['Đốt khí gas','Sản xuất vôi (nung đá vôi)','Vôi sống + nước','Đốt than'], a:1, why:'Nung đá vôi cần cấp nhiệt liên tục.'}}
 ],
 video:[{t:'title',big:'Phản ứng hóa học',sub:'Bài 2',say:'Phản ứng hóa học là gì? Cùng xem nhé.'},
