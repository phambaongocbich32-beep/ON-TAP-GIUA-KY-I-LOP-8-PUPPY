 {t:'compare',a:{h:'Biến đổi vật lí',l:['Không tạo chất mới','Băng tan','Hòa tan muối','Cồn bay hơi']},b:{h:'Biến đổi hóa học',l:['Có chất mới','Cháy rừng','Sắt gỉ','Thức ăn ôi thiu']},say:'Em chỉ cần hỏi: có chất mới không? Có là hóa học, không là vật lí.'},
 {t:'list',items:['Có chất khí thoát ra','Có kết tủa','Đổi màu, đổi mùi vị','Phát sáng, tỏa hoặc thu nhiệt'],say:'Dấu hiệu nhận biết phản ứng: chất khí, kết tủa, đổi màu hoặc mùi vị, phát sáng, tỏa hoặc thu nhiệt.'},
 {t:'compare',a:{h:'Tỏa nhiệt 🔥',l:['Đốt than, gas, xăng','Vôi sống + nước','Magnesium cháy']},b:{h:'Thu nhiệt ❄',l:['Nung đá vôi','Nhiệt phân đường']},say:'Tỏa nhiệt là giải phóng nhiệt, như đốt gas. Thu nhiệt phải liên tục cung cấp nhiệt, như nung đá vôi.'},
 {t:'formula',lines:['magnesium + oxygen','→ magnesium oxide','Chất tham gia → Sản phẩm'],say:'Phương trình chữ: chất tham gia viết bên trái, sản phẩm bên phải mũi tên.'}]},

{id:'h3', s:'hoa', n:'Bài 3', title:'Mol và thể tích chất khí', goal:'Dùng thành thạo n, m, M, V (đkc), số hạt; nhớ 24,79 L.',
 steps:[
 {h:'Mol là gì?', html:`<p><b>1 mol</b> = lượng chất chứa <b>N<sub>A</sub> = 6,022·10²³</b> hạt (nguyên tử hoặc phân tử).</p>
 <div class="eq">Số hạt = n × 6,022·10²³ &nbsp;&nbsp; ⇔ &nbsp;&nbsp; n = Số hạt / 6,022·10²³</div>
 <p>VD: 3,011·10²³ phân tử O₂ → n = 0,5 mol. 3,0·10²³ nguyên tử Zn → n = 0,5 mol.</p>`,
  chk:{q:'6,022·10²³ nguyên tử Fe là bao nhiêu mol?', o:['0,5 mol','1 mol','2 mol','6 mol'], a:1, why:'Đúng 1 N_A hạt = 1 mol.'}},
 {h:'Khối lượng mol M và công thức m = n·M', html:`<p><b>Khối lượng mol M</b>: khối lượng của 1 mol chất (g/mol), có số trị bằng <b>phân tử khối / nguyên tử khối</b>.</p>
 <div class="eq">n = m / M &nbsp;&nbsp;|&nbsp;&nbsp; m = n · M</div>
 <table class="tb"><tr><th>Chất</th><th>M (g/mol)</th></tr><tr><td>H₂</td><td>2</td></tr><tr><td>O₂</td><td>32</td></tr><tr><td>N₂</td><td>28</td></tr><tr><td>CO₂</td><td>44</td></tr><tr><td>SO₂</td><td>64</td></tr><tr><td>H₂SO₄</td><td>98</td></tr><tr><td>NaCl</td><td>58,5</td></tr><tr><td>NaOH</td><td>40</td></tr><tr><td>Cu</td><td>64</td></tr></table>
 <p><b>Ví dụ:</b> m của 0,3 mol H₂SO₄ = 0,3 × 98 = 29,4 g.</p>`,
  chk:{q:'Số mol của 11,7 g NaCl (M = 58,5)?', o:['0,1 mol','0,2 mol','0,5 mol','2 mol'], a:1, why:'n = 11,7/58,5 = 0,2 mol.'}},
 {h:'Thể tích mol chất khí ở đkc', html:`<p>Ở <b>điều kiện chuẩn (25 °C, 1 bar)</b>, 1 mol bất kì chất khí chiếm <b>24,79 L</b>.</p>
 <div class="eq">V = n × 24,79 &nbsp;&nbsp;|&nbsp;&nbsp; n = V / 24,79</div>
 <p><b>Ví dụ:</b> 6,4 g O₂ → n = 6,4/32 = 0,2 mol → V = 0,2 × 24,79 = 4,958 L.</p>
 <p>Ngược lại: 7,437 L SO₂ → n = 0,3 mol → m = 0,3 × 64 = 19,2 g.</p>
 <div class="map">m ⇄(÷M, ×M) n ⇄(×24,79, ÷24,79) V &nbsp;|&nbsp; n ⇄(×N<sub>A</sub>) số hạt</div>`,
  chk:{q:'Thể tích của 0,5 mol CO₂ ở đkc?', o:['11,2 L','12,395 L','24,79 L','22 L'], a:1, why:'0,5 × 24,79 = 12,395 L.'}},
 {h:'Nồng độ phần trăm (bổ sung)', html:`<p>C% = <b>m chất tan / m dung dịch × 100%</b>. Cho biết số gam chất tan trong <b>100 g dung dịch</b>.</p>`,
  chk:{q:'Nồng độ phần trăm cho biết:', o:['Số mol chất tan trong 1 L dung dịch','Số gam chất tan trong 100 g dung dịch','Thể tích dung dịch','Khối lượng mol'], a:1, why:'Đó là định nghĩa C%.'}}
 ],
 video:[{t:'title',big:'Mol & thể tích khí',sub:'Bài 3',say:'Mol là đơn vị đo lượng chất. Em sẽ nhớ ba công thức là giải được mọi bài.'},
 {t:'svg',key:'mol',say:'Một mol chứa sáu phẩy không hai hai nhân mười mũ hai mươi ba hạt, ký hiệu N A.'},
 {t:'formula',lines:['n = m / M','m = n × M','V = n × 24,79 (L, đkc)'],say:'Ba công thức: n bằng m chia M. m bằng n nhân M. V bằng n nhân hai mươi bốn phẩy bảy chín.'},
 {t:'calc',title:'Ví dụ: 6,4 g O₂ → V ?',lines:['M(O₂) = 32','n = 6,4 / 32 = 0,2 mol','V = 0,2 × 24,79 = 4,958 L'],say:'Ví dụ: sáu phẩy bốn gam oxygen. Tính số mol: sáu phẩy bốn chia ba mươi hai bằng không phẩy hai. Thể tích bằng không phẩy hai nhân hai mươi bốn phẩy bảy chín, được bốn phẩy chín năm tám lít.'},
 {t:'list',items:['Đổi ra mol trước','Rồi mới đổi sang m, V hoặc số hạt','Nhớ M của H₂ 2, O₂ 32, CO₂ 44, SO₂ 64'],say:'Mẹo: luôn đổi ra mol trước, mol là cầu nối giữa khối lượng, thể tích và số hạt.'}]},

{id:'h4', s:'hoa', n:'Bài 3 (tiếp)', title:'Tỉ khối chất khí', goal:'So sánh khí nặng/nhẹ, tìm M qua tỉ khối, giải thích thực tế.',
 steps:[
 {h:'Công thức tỉ khối', html:`<div class="eq">d(A/B) = M<sub>A</sub> / M<sub>B</sub> &nbsp;&nbsp;|&nbsp;&nbsp; d(A/kk) = M<sub>A</sub> / 29</div>
 <p>d &gt; 1: A <b>nặng hơn</b> B (d lần). d &lt; 1: A <b>nhẹ hơn</b> B.</p>
 <p>Khối lượng mol trung bình của không khí ≈ <b>29 g/mol</b>.</p>`,
  chk:{q:'d(CO₂/kk) bằng bao nhiêu?', o:['0,55','1,52','2,21','0,07'], a:1, why:'44/29 ≈ 1,52 → nặng hơn không khí.'}},
 {h:'So sánh nhanh', html:`<table class="tb"><tr><th>Khí</th><th>M</th><th>So với không khí (29)</th></tr><tr><td>H₂</td><td>2</td><td>nhẹ (0,07)</td></tr><tr><td>He</td><td>4</td><td>nhẹ (0,14)</td></tr><tr><td>CH₄</td><td>16</td><td>nhẹ (0,55)</td></tr><tr><td>N₂</td><td>28</td><td>nhẹ (0,97)</td></tr><tr><td>O₂</td><td>32</td><td>nặng (1,10)</td></tr><tr><td>CO₂</td><td>44</td><td>nặng (1,52)</td></tr><tr><td>SO₂</td><td>64</td><td>nặng (2,21)</td></tr></table>
 <p>Khí có M &lt; 29 nhẹ hơn không khí; M &gt; 29 nặng hơn.</p>`,
  chk:{q:'Khí nào nặng hơn không khí?', o:['H₂','CH₄','O₂','He'], a:2, why:'M(O₂) = 32 > 29.'}},
 {h:'Ứng dụng thực tế', html:`<ul><li><b>Bóng bay, khinh khí cầu</b> bơm H₂ hoặc He vì nhẹ hơn không khí nên bay lên.</li>
 <li><b>Hang sâu, giếng cạn</b>: CO₂ nặng hơn không khí nên tích tụ dưới nền, rất nguy hiểm.</li>
 <li><b>Thu khí:</b> khí nhẹ hơn không khí (H₂, N₂…) → <b>đặt úp bình</b>; khí nặng hơn (CO₂, O₂…) → <b>đặt đứng bình</b>.</li></ul>
 <p><b>Tìm M:</b> d(A/O₂) = 5 → M<sub>A</sub> = 5 × 32 = 160.</p>`,
  chk:{q:'Vì sao bóng bay bơm helium bay lên?', o:['He có màu nhạt','He nhẹ hơn không khí (d < 1)','He tỏa nhiệt','He dễ cháy'], a:1, why:'d(He/kk) = 4/29 < 1.'}}
 ],
 video:[{t:'title',big:'Tỉ khối chất khí',sub:'Khí nào nặng, khí nào nhẹ?',say:'Muốn biết khí này nặng hay nhẹ hơn khí kia, em dùng tỉ khối.'},
 {t:'formula',lines:['d(A/B) = M_A / M_B','d(A/không khí) = M_A / 29'],say:'Tỉ khối của A so với B bằng khối lượng mol A chia khối lượng mol B. Với không khí thì chia cho hai mươi chín.'},
 {t:'svg',key:'balloon',say:'Helium có khối lượng mol bốn, nhỏ hơn hai mươi chín nên nhẹ hơn không khí, bóng bay lên. Carbon dioxide bốn mươi bốn, nặng hơn nên chìm xuống.'},
 {t:'list',items:['Khí nhẹ → đặt úp bình','Khí nặng → đặt đứng bình','CO₂ tích tụ ở nền hang sâu'],say:'Thu khí nhẹ thì úp bình, thu khí nặng thì đặt đứng bình. Khí CO₂ nặng nên tích tụ ở nền hang sâu.'}]},

/* ================= SINH ================= */
{id:'s30', s:'sinh', n:'Bài 30', title:'Khái quát về cơ thể người', goal:'Nêu tên, vai trò các hệ cơ quan.',
 steps:[
 {h:'Cơ thể gồm 3 phần', html:`<p>Cơ thể người gồm <b>3 phần: đầu, thân, các chi</b>. Phần thân có <b>khoang ngực</b> (tim, phổi) và <b>khoang bụng</b> (dạ dày, ruột, gan, thận…), ngăn cách bởi <b>cơ hoành</b>.</p>`,
  chk:{q:'Cơ thể người chia làm mấy phần?', o:['2','3','4','5'], a:1, why:'Đầu, thân, các chi.'}},
 {h:'Các hệ cơ quan và vai trò', html:`<table class="tb"><tr><th>Hệ</th><th>Cơ quan chính</th><th>Vai trò</th></tr>
 <tr><td>Vận động</td><td>Xương, cơ</td><td>Nâng đỡ, bảo vệ, vận động</td></tr>
 <tr><td>Tiêu hóa</td><td>Miệng, thực quản, dạ dày, ruột, gan, tụy…</td><td>Biến đổi thức ăn, hấp thụ chất dinh dưỡng</td></tr>
 <tr><td>Tuần hoàn</td><td>Tim, mạch máu</td><td>Vận chuyển máu, chất dinh dưỡng, O₂, CO₂</td></tr>
 <tr><td>Hô hấp</td><td>Mũi, khí quản, phế quản, phổi</td><td>Trao đổi khí O₂ / CO₂</td></tr>
 <tr><td>Bài tiết</td><td>Thận, ống dẫn nước tiểu, bóng đái, ống đái</td><td>Lọc máu, thải nước tiểu</td></tr>
 <tr><td>Thần kinh</td><td>Não, tủy sống, dây thần kinh</td><td>Tiếp nhận, xử lí thông tin, điều khiển</td></tr>
 <tr><td>Sinh sản, nội tiết</td><td>Cơ quan sinh sản, tuyến nội tiết</td><td>Duy trì nòi giống, điều hòa bằng hormone</td></tr></table>`,
  chk:{q:'Hệ nào lưu trữ, xử lí thông tin và dẫn truyền xung thần kinh?', o:['Vận động','Tuần hoàn','Bài tiết','Thần kinh'], a:3, why:'Hệ thần kinh.'}}
 ],
 video:[{t:'title',big:'Cơ thể người',sub:'Bài 30',say:'Cơ thể người là một thể thống nhất, gồm nhiều hệ cơ quan phối hợp.'},
 {t:'list',items:['3 phần: đầu, thân, các chi','Cơ hoành ngăn ngực và bụng'],say:'Cơ thể có ba phần: đầu, thân và các chi. Cơ hoành ngăn khoang ngực với khoang bụng.'},
 {t:'compare',a:{h:'Hệ cơ quan',l:['Vận động','Tiêu hóa','Tuần hoàn','Hô hấp']},b:{h:'Vai trò',l:['Nâng đỡ, vận động','Lấy chất dinh dưỡng','Vận chuyển máu','Trao đổi khí']},say:'Hệ vận động nâng đỡ, tiêu hóa lấy chất dinh dưỡng, tuần hoàn vận chuyển máu, hô hấp trao đổi khí.'},
 {t:'compare',a:{h:'Bài tiết',l:['Thận, bóng đái','Lọc máu, thải nước tiểu']},b:{h:'Thần kinh',l:['Não, tủy sống','Điều khiển cơ thể']},say:'Hệ bài tiết lọc máu và thải nước tiểu. Hệ thần kinh điều khiển mọi hoạt động.'}]},

{id:'s31', s:'sinh', n:'Bài 31', title:'Hệ vận động ở người', goal:'Chức năng, bệnh loãng xương, phòng chống bệnh tật.',
 steps:[
 {h:'Cấu tạo và chức năng', html:`<p>Hệ vận động gồm <b>xương</b> và <b>cơ</b>. Chức năng:</p><ul><li><b>Nâng đỡ</b> cơ thể, tạo hình dáng.</li><li><b>Bảo vệ</b> nội quan (sọ bảo vệ não, lồng ngực bảo vệ tim phổi).</li><li><b>Giúp cơ thể vận động</b> (cơ co, kéo xương).</li></ul>
 <p>Thành phần xương: <b>chất hữu cơ (cốt giao)</b> → mềm dẻo; <b>chất vô cơ (muối calcium)</b> → cứng chắc. Trẻ em nhiều chất hữu cơ; người già nhiều chất vô cơ → xương giòn, dễ gãy.</p>`,
  chk:{q:'Hệ vận động gồm:', o:['Não, tủy sống','Xương, cơ','Tim, mạch','Thận, bóng đái'], a:1, why:'Xương và cơ.'}},
 {h:'Xương to ra, dài ra, cơ mỏi', html:`<ul><li>Xương <b>to ra bề ngang</b> nhờ tế bào <b>màng xương</b> phân chia, tạo tế bào mới đẩy <b>vào trong</b> và hóa xương.</li>
 <li>Xương <b>dài ra</b> nhờ sụn tăng trưởng ở hai đầu xương.</li>
 <li><b>Mỏi cơ:</b> cơ co liên tục, thiếu oxygen → tích tụ <b>acid lactic</b> đầu độc cơ.</li></ul>`,
  chk:{q:'Xương to ra về bề ngang nhờ:', o:['Sụn tăng trưởng','Màng xương','Mô xương cứng','Tủy đỏ'], a:1, why:'Màng xương.'}},
 {h:'Loãng xương và phòng bệnh', html:`<p><b>Loãng xương:</b> xương mất calcium, trở nên <b>xốp, giòn, dễ gãy</b> (đau lưng, gù, lùn đi, gãy xương khi va chạm nhẹ). Nguyên nhân: tuổi già, thiếu calcium/vitamin D, ít vận động.</p>
 <p><b>Bệnh, tật khác:</b> cong vẹo cột sống, còi xương, thoái hóa khớp, gãy xương.</p>
 <p><b>Phòng tránh:</b> ăn đủ calcium, vitamin D; tắm nắng buổi sáng; tập thể dục vừa sức; ngồi học, mang vác <b>đúng tư thế</b>; bàn ghế phù hợp; cặp không quá nặng.</p>`,
  chk:{q:'Biện pháp chống cong vẹo cột sống ở học sinh?', o:['Ngồi học lệch người','Đeo cặp nặng một bên','Ngồi học đúng tư thế, bàn ghế phù hợp','Ít vận động'], a:2, why:'Ngồi đúng tư thế và bàn ghế phù hợp.'}}
 ],
 video:[{t:'title',big:'Hệ vận động',sub:'Bài 31',say:'Hệ vận động gồm xương và cơ.'},
 {t:'list',items:['Nâng đỡ cơ thể','Bảo vệ nội quan','Giúp cơ thể vận động'],say:'Chức năng: nâng đỡ, bảo vệ nội quan và giúp cơ thể vận động.'},
 {t:'compare',a:{h:'Chất hữu cơ (cốt giao)',l:['Mềm dẻo']},b:{h:'Chất vô cơ (muối calcium)',l:['Cứng chắc']},say:'Chất hữu cơ làm xương mềm dẻo, chất vô cơ làm xương cứng chắc. Người già nhiều chất vô cơ nên xương dễ gãy.'},
 {t:'list',items:['Loãng xương: xương xốp, giòn, dễ gãy','Ăn đủ calcium, vitamin D, tắm nắng','Tập thể dục, ngồi đúng tư thế'],say:'Loãng xương làm xương xốp, giòn, dễ gãy. Phòng bằng ăn đủ calcium, vitamin D, tắm nắng, tập thể dục và ngồi đúng tư thế.'}]},

{id:'s32', s:'sinh', n:'Bài 32', title:'Dinh dưỡng và tiêu hóa', goal:'Khái niệm dinh dưỡng, tiêu hóa, bệnh tiêu hóa.',
 steps:[
 {h:'Dinh dưỡng và chất dinh dưỡng', html:`<p><b>Dinh dưỡng</b>: quá trình cơ thể lấy thức ăn, biến đổi, hấp thụ chất dinh dưỡng và dùng cho hoạt động sống.</p>
 <p><b>Chất dinh dưỡng:</b> carbohydrate (tinh bột, đường), protein, lipid, vitamin, muối khoáng, nước (và chất xơ).</p>
 <p><b>Tiêu hóa</b> biến thức ăn thành chất đơn giản để hấp thụ. Tiêu hóa tốt → dinh dưỡng tốt.</p>`,
  chk:{q:'Cơ quan nào KHÔNG thuộc hệ tiêu hóa?', o:['Thực quản','Dạ dày','Khí quản','Ruột non'], a:2, why:'Khí quản thuộc hô hấp.'}},
 {h:'Tiêu hóa ở các bộ phận', html:`<table class="tb"><tr><th>Nơi</th><th>Hoạt động</th></tr>
 <tr><td>Miệng</td><td>Nhai (cơ học); <b>amylase</b> biến tinh bột chín → đường maltose (hóa học). Enzyme nước bọt tốt nhất ở <b>pH 7,2 và 37 °C</b></td></tr>
 <tr><td>Dạ dày</td><td>Co bóp; <b>pepsin + HCl</b> tiêu hóa protein</td></tr>
 <tr><td>Ruột non</td><td>Tiêu hóa mạnh nhất (dịch mật, tụy, ruột); <b>hấp thụ</b> hầu hết chất dinh dưỡng</td></tr>
 <tr><td>Ruột già</td><td>Hấp thụ nước, tạo phân</td></tr></table>`,
  chk:{q:'Chất nào được tiêu hóa hóa học đầu tiên ở khoang miệng?', o:['Lipid','Protein','Tinh bột','Vitamin'], a:2, why:'Amylase biến đổi tinh bột.'}},
 {h:'Bệnh tiêu hóa và cách phòng', html:`<ul><li><b>Răng, miệng:</b> sâu răng, viêm lợi → đánh răng sau ăn, ăn ít đồ ngọt, khám răng định kì.</li>
 <li><b>Dạ dày:</b> viêm loét dạ dày (vi khuẩn HP) → ăn đúng giờ, tránh cay, rượu bia, giảm stress.</li>
 <li><b>Đường ruột:</b> tiêu chảy, táo bón, ngộ độc → <b>ăn chín uống sôi</b>, rửa tay, thực phẩm sạch, ăn rau xanh, uống đủ nước.</li></ul>`,
  chk:{q:'Cách phòng bệnh đường ruột?', o:['Ăn đồ sống','Ăn chín, uống sôi, rửa tay','Uống nước lã','Ăn thức ăn ôi'], a:1, why:'Ăn chín uống sôi.'}}
 ],
 video:[{t:'title',big:'Dinh dưỡng & tiêu hóa',sub:'Bài 32',say:'Thức ăn đi qua ống tiêu hóa và được biến đổi thành chất dinh dưỡng.'},
 {t:'list',items:['Miệng: amylase biến tinh bột','Dạ dày: pepsin, HCl tiêu hóa protein','Ruột non: hấp thụ chất dinh dưỡng','Ruột già: hấp thụ nước, tạo phân'],say:'Ở miệng, amylase biến đổi tinh bột. Dạ dày tiêu hóa protein. Ruột non hấp thụ chất dinh dưỡng. Ruột già hấp thụ nước và tạo phân.'},
 {t:'list',items:['Đánh răng sau ăn','Ăn đúng giờ, tránh cay','Ăn chín, uống sôi, rửa tay'],say:'Phòng bệnh: đánh răng sau ăn, ăn đúng giờ, ăn chín uống sôi và rửa tay.'}]},

{id:'s33', s:'sinh', n:'Bài 33', title:'Máu và hệ tuần hoàn', goal:'Thành phần máu, chức năng; hệ tuần hoàn; hiến máu.',
 steps:[
 {h:'Thành phần của máu', html:`<table class="tb"><tr><th>Thành phần</th><th>Chức năng</th></tr>
 <tr><td><b>Huyết tương</b> (~55%, 90% nước)</td><td>Vận chuyển chất dinh dưỡng, hormone, chất thải; duy trì máu ở trạng thái lỏng</td></tr>
 <tr><td><b>Hồng cầu</b> (chứa hemoglobin)</td><td>Vận chuyển <b>O₂ và CO₂</b></td></tr>
 <tr><td><b>Bạch cầu</b></td><td><b>Bảo vệ cơ thể</b> (thực bào, tạo kháng thể)</td></tr>
 <tr><td><b>Tiểu cầu</b></td><td>Tham gia <b>đông máu</b></td></tr></table>`,
  chk:{q:'Tế bào máu nào tham gia đông máu?', o:['Hồng cầu','Bạch cầu','Tiểu cầu','Huyết tương'], a:2, why:'Tiểu cầu.'}},
 {h:'Hệ tuần hoàn', html:`<p>Gồm <b>tim</b> và <b>hệ mạch</b> (động mạch, tĩnh mạch, mao mạch). Máu chảy trong mạch kín nhờ tim co bóp.</p>
 <ul><li><b>Vòng tuần hoàn lớn:</b> tim → cơ thể → tim (nuôi cơ thể).</li><li><b>Vòng nhỏ:</b> tim → phổi → tim (trao đổi khí).</li></ul>
 <p><b>Chức năng máu và hệ tuần hoàn:</b> vận chuyển O₂, CO₂, chất dinh dưỡng, chất thải; bảo vệ cơ thể; điều hòa thân nhiệt.</p>`,
  chk:{q:'Hồng cầu có chức năng gì?', o:['Bảo vệ','Đông máu','Vận chuyển O₂ và CO₂','Tạo nước tiểu'], a:2, why:'Hồng cầu chứa hemoglobin.'}},
 {h:'Truyền máu, hiến máu nhân đạo', html:`<p>Nhóm máu: A, B, AB, O. Truyền máu phải <b>đúng nhóm</b>. O cho được mọi nhóm; AB nhận được mọi nhóm.</p>
 <p><b>Ý nghĩa:</b> cứu người mất máu, bệnh nhân phẫu thuật, tai nạn. Hiến máu an toàn, cơ thể nhanh phục hồi → nên <b>tuyên truyền</b> cùng tham gia hiến máu nhân đạo.</p>`,
  chk:{q:'Vì sao hiến máu nhân đạo có ý nghĩa?', o:['Để lấy tiền','Cứu sống người cần máu','Làm giảm cân','Không có ý nghĩa'], a:1, why:'Hiến máu cứu người.'}}
 ],
 video:[{t:'title',big:'Máu & tuần hoàn',sub:'Bài 33',say:'Máu gồm huyết tương và các tế bào máu.'},
 {t:'svg',key:'blood',say:'Hồng cầu vận chuyển oxygen và carbon dioxide. Bạch cầu bảo vệ cơ thể. Tiểu cầu giúp đông máu. Huyết tương vận chuyển chất dinh dưỡng và chất thải.'},
 {t:'list',items:['Tim + hệ mạch','Vòng lớn: nuôi cơ thể','Vòng nhỏ: qua phổi trao đổi khí'],say:'Hệ tuần hoàn gồm tim và mạch máu, có vòng tuần hoàn lớn và vòng tuần hoàn nhỏ.'},
 {t:'list',items:['Truyền máu đúng nhóm','Hiến máu cứu sống người bệnh','Tuyên truyền hiến máu nhân đạo'],say:'Hiến máu nhân đạo cứu sống nhiều người. Em hãy cùng tuyên truyền nhé.'}]},

{id:'s34', s:'sinh', n:'Bài 34', title:'Hô hấp ở người', goal:'Chức năng hô hấp, bệnh hô hấp, vận dụng bảo vệ bản thân.',
 steps:[
 {h:'Hệ hô hấp và chức năng', html:`<p>Gồm <b>đường dẫn khí</b> (mũi → hầu → thanh quản → khí quản → phế quản) và <b>hai lá phổi</b> (phế nang).</p>
 <p><b>Chức năng:</b> <b>trao đổi khí</b> – lấy O₂ từ môi trường vào máu, thải CO₂ ra ngoài. Hít vào: cơ liên sườn và cơ hoành co → lồng ngực mở rộng.</p>`,
  chk:{q:'Chức năng chính của hệ hô hấp?', o:['Tiêu hóa thức ăn','Trao đổi khí O₂ và CO₂','Lọc máu','Dẫn truyền xung thần kinh'], a:1, why:'Trao đổi khí.'}},
 {h:'Bệnh về hô hấp & cách phòng', html:`<ul><li>Viêm phổi, lao phổi, hen suyễn, viêm phế quản, ung thư phổi, COVID-19, cúm…</li></ul>
 <p><b>Phòng tránh:</b> <b>không hút thuốc lá</b>, tránh bụi, khói; đeo khẩu trang; giữ ấm; vệ sinh mũi họng; tiêm vaccine; tập thở, thể dục; trồng cây xanh; nhà thoáng khí.</p>`,
  chk:{q:'Việc làm nào bảo vệ hệ hô hấp?', o:['Hút thuốc lá','Đeo khẩu trang nơi nhiều bụi','Ở nơi kín nhiều khói','Thở bằng miệng'], a:1, why:'Đeo khẩu trang tránh bụi khói.'}}
 ],
 video:[{t:'title',big:'Hô hấp ở người',sub:'Bài 34',say:'Hô hấp giúp cơ thể lấy oxygen và thải carbon dioxide.'},
 {t:'list',items:['Mũi → hầu → thanh quản','→ khí quản → phế quản → phổi','Phế nang: nơi trao đổi khí'],say:'Không khí đi qua mũi, hầu, thanh quản, khí quản, phế quản rồi đến phổi, nơi phế nang trao đổi khí.'},
 {t:'list',items:['Không hút thuốc lá','Đeo khẩu trang, tránh bụi khói','Giữ ấm, vệ sinh mũi họng, tập thể dục'],say:'Để bảo vệ phổi, em không hút thuốc, đeo khẩu trang, giữ ấm, vệ sinh mũi họng và tập thể dục.'}]},

{id:'s35', s:'sinh', n:'Bài 35', title:'Hệ bài tiết ở người', goal:'Chức năng hệ bài tiết, bệnh và cách phòng.',
 steps:[
 {h:'Cấu tạo và chức năng', html:`<p>Hệ bài tiết nước tiểu: <b>thận</b> (lọc máu, tạo nước tiểu) → <b>ống dẫn nước tiểu</b> → <b>bóng đái</b> (chứa) → <b>ống đái</b> (thải).</p>
 <p><b>Chức năng:</b> lọc máu, thải chất thải (urea, uric acid, thừa nước, muối) → <b>giữ ổn định môi trường trong</b>. Phổi (CO₂) và da (mồ hôi) cũng tham gia bài tiết.</p>`,
  chk:{q:'Cơ quan lọc máu và tạo nước tiểu?', o:['Bóng đái','Thận','Ống đái','Phổi'], a:1, why:'Thận.'}},
 {h:'Bệnh hệ bài tiết', html:`<ul><li><b>Sỏi thận, viêm cầu thận, suy thận, viêm đường tiết niệu.</b></li></ul>
 <p><b>Phòng chống:</b> uống đủ nước; <b>không nhịn tiểu</b>; ăn hợp lí (giảm muối, đạm, tránh chất bảo quản); vệ sinh cơ quan sinh dục; không dùng thuốc bừa bãi; khám định kì.</p>`,
  chk:{q:'Biện pháp phòng bệnh thận?', o:['Nhịn tiểu','Uống đủ nước','Ăn quá mặn','Dùng thuốc bừa'], a:1, why:'Uống đủ nước.'}}
 ],
 video:[{t:'title',big:'Hệ bài tiết',sub:'Bài 35',say:'Thận lọc máu và tạo nước tiểu.'},
 {t:'list',items:['Thận lọc máu → nước tiểu','Ống dẫn nước tiểu','Bóng đái chứa','Ống đái thải ra ngoài'],say:'Nước tiểu đi từ thận qua ống dẫn nước tiểu đến bóng đái, rồi thải ra ngoài qua ống đái.'},
 {t:'list',items:['Uống đủ nước','Không nhịn tiểu','Ăn ít muối, vệ sinh sạch sẽ'],say:'Phòng bệnh: uống đủ nước, không nhịn tiểu, ăn ít muối và giữ vệ sinh.'}]},

{id:'s36', s:'sinh', n:'Bài 36', title:'Điều hòa môi trường trong', goal:'Môi trường trong, vai trò ổn định glucose, muối, urea, pH.',
 steps:[
 {h:'Môi trường trong của cơ thể', html:`<p><b>Môi trường trong</b> gồm <b>máu, nước mô, bạch huyết</b> – bao quanh các tế bào. Tế bào trao đổi chất với môi trường trong.</p>`,
  chk:{q:'Môi trường trong gồm:', o:['Máu, nước mô, bạch huyết','Không khí','Nước tiểu','Dịch vị'], a:0, why:'Máu, nước mô, bạch huyết.'}},
 {h:'Vì sao phải ổn định?', html:`<p>Các chỉ số phải ổn định để tế bào hoạt động bình thường:</p>
 <ul><li><b>Glucose máu</b> ≈ 0,1% (insulin làm giảm; glucagon làm tăng). Cao kéo dài → tiểu đường.</li><li><b>Muối</b> (NaCl ≈ 0,9%) giữ cân bằng nước.</li><li><b>pH máu</b> 7,35–7,45.</li><li><b>Urea, uric acid</b>: do thận thải; tăng cao → suy thận, bệnh gút.</li><li>Thân nhiệt ≈ 37 °C.</li></ul>
 <p>Duy trì nhờ <b>thận, gan, phổi, hệ thần kinh, hormone</b>.</p>`,
  chk:{q:'Nếu glucose máu tăng cao kéo dài thì dễ mắc?', o:['Còi xương','Tiểu đường','Cận thị','Loãng xương'], a:1, why:'Tiểu đường.'}}
 ],
 video:[{t:'title',big:'Môi trường trong',sub:'Bài 36',say:'Môi trường trong gồm máu, nước mô và bạch huyết.'},
 {t:'list',items:['Glucose máu ≈ 0,1%','Muối NaCl ≈ 0,9%','pH máu 7,35 – 7,45','Urea, uric acid được thận thải'],say:'Cơ thể giữ ổn định glucose, muối, pH và các chất thải như urea, uric acid để tế bào hoạt động bình thường.'}]},

{id:'s37', s:'sinh', n:'Bài 37', title:'Thần kinh và các giác quan', goal:'Hệ thần kinh, thị giác, thính giác, tật khúc xạ.',
 steps:[
 {h:'Hệ thần kinh', html:`<p>Hai bộ phận:</p><ul><li><b>Trung ương:</b> <b>não, tủy sống</b></li><li><b>Ngoại biên:</b> <b>dây thần kinh, hạch thần kinh</b></li></ul>
 <p><b>Chức năng:</b> tiếp nhận, xử lí thông tin; điều khiển, điều hòa hoạt động cơ thể; giúp thích nghi với môi trường. Giác quan (mắt, tai, mũi, lưỡi, da) <b>thu nhận kích thích</b>.</p>`,
  chk:{q:'Bộ phận trung ương của hệ thần kinh gồm:', o:['Dây thần kinh, hạch','Não, tủy sống','Mắt, tai','Tim, phổi'], a:1, why:'Não và tủy sống.'}},
 {h:'Thị giác và thính giác', html:`<p><b>Mắt:</b> ánh sáng qua giác mạc → thể thủy tinh → hội tụ trên <b>võng mạc</b> (tế bào nón, que) → dây thị giác → não. <b>Chức năng thị giác:</b> thu nhận hình ảnh, màu sắc.</p>
 <p><b>Tai:</b> tai ngoài (hứng âm) → tai giữa (<b>màng nhĩ</b>, chuỗi xương) → tai trong (<b>ốc tai</b> chuyển thành xung thần kinh). <b>Chức năng thính giác:</b> thu nhận âm thanh.</p>`,
  chk:{q:'Ảnh của vật hiện trên bộ phận nào của mắt?', o:['Giác mạc','Võng mạc','Màng nhĩ','Ốc tai'], a:1, why:'Võng mạc.'}},
 {h:'Tật về mắt và bảo vệ mắt', html:`<table class="tb"><tr><th></th><th>Cận thị</th><th>Viễn thị</th></tr><tr><td>Nhìn</td><td>Gần rõ, xa mờ</td><td>Xa rõ, gần mờ</td></tr><tr><td>Kính</td><td>Phân kì (kính lõm)</td><td>Hội tụ (kính lồi)</td></tr></table>
 <p><b>Bảo vệ mắt:</b> đọc sách đủ sáng, cách mắt ~30 cm, ngồi thẳng; hạn chế điện thoại, tivi; nghỉ mắt (quy tắc 20-20-20); không dụi mắt; ăn đủ vitamin A; khám mắt định kì.</p>`,
  chk:{q:'Bạn bị cận thị cần đeo kính:', o:['Hội tụ','Phân kì','Râm','Không cần'], a:1, why:'Phân kì.'}}
 ],
 video:[{t:'title',big:'Thần kinh & giác quan',sub:'Bài 37',say:'Hệ thần kinh điều khiển mọi hoạt động của cơ thể.'},
 {t:'compare',a:{h:'Trung ương',l:['Não','Tủy sống']},b:{h:'Ngoại biên',l:['Dây thần kinh','Hạch thần kinh']},say:'Trung ương gồm não và tủy sống. Ngoại biên gồm dây thần kinh và hạch thần kinh.'},
 {t:'list',items:['Ánh sáng → giác mạc → thể thủy tinh','Ảnh hiện trên võng mạc','Tai: màng nhĩ → ốc tai → não'],say:'Ánh sáng đi qua giác mạc, thể thủy tinh, tạo ảnh trên võng mạc. Âm thanh làm rung màng nhĩ, đến ốc tai rồi truyền lên não.'},
 {t:'compare',a:{h:'Cận thị',l:['Nhìn gần rõ','Kính phân kì']},b:{h:'Viễn thị',l:['Nhìn xa rõ','Kính hội tụ']},say:'Cận thị nhìn gần rõ, đeo kính phân kì. Viễn thị nhìn xa rõ, đeo kính hội tụ. Hãy giữ gìn đôi mắt nhé.'}]},

/* ================= LÝ ================= */
{id:'l1', s:'ly', n:'Vật lí', title:'Khối lượng riêng', goal:'Dùng D = m/V, đổi đơn vị, nhận biết chất.',
 steps:[
 {h:'Khái niệm và công thức', html:`<div class="eq">D = m / V &nbsp;&nbsp;⇒&nbsp;&nbsp; m = D·V &nbsp;&nbsp;⇒&nbsp;&nbsp; V = m / D</div>
 <p><b>Khối lượng riêng</b> là khối lượng của <b>1 đơn vị thể tích</b>. Đơn vị <b>kg/m³</b> hoặc <b>g/cm³</b>: 1 g/cm³ = 1000 kg/m³.</p>
 <p>Mỗi chất có D <b>riêng</b>, không phụ thuộc kích thước vật. Hai khối nhôm to nhỏ khác nhau vẫn có D bằng nhau.</p>`,
  chk:{q:'Hai khối nhôm, khối 1 thể tích gấp đôi khối 2. D của chúng?', o:['D₁ = 2D₂','D₂ = 2D₁','Bằng nhau','Không so sánh được'], a:2, why:'Cùng chất thì D bằng nhau.'}},
 {h:'Bảng D và nhận biết chất', html:`<table class="tb"><tr><th>Chất</th><th>D (kg/m³)</th></tr><tr><td>Nước</td><td>1000</td></tr><tr><td>Nhôm</td><td>2700</td></tr><tr><td>Sắt</td><td>7800</td></tr><tr><td>Đồng</td><td>8900</td></tr><tr><td>Chì</td><td>11300</td></tr></table>
 <p><b>Ví dụ:</b> khối đồng chất 300 cm³, nặng 810 g → D = 810/300 = 2,7 g/cm³ = 2700 kg/m³ → <b>nhôm</b>.</p>
 <p><b>Đo D của vật bất kì:</b> dùng <b>cân</b> (đo m) và <b>bình chia độ</b> (đo V).</p>`,
  chk:{q:'D = 7,8 g/cm³ là kim loại nào?', o:['Nhôm','Sắt','Đồng','Chì'], a:1, why:'7,8 g/cm³ = 7800 kg/m³ = sắt.'}},
 {h:'Bài mẫu: đổi đơn vị', html:`<p>Gỗ D = 800 kg/m³, V = 500 cm³.</p><ol><li>Đổi: 500 cm³ = 5·10⁻⁴ m³ (chia cho 1 000 000).</li><li>m = D·V = 800 × 5·10⁻⁴ = <b>0,4 kg</b>.</li><li>P = 10m = <b>4 N</b>.</li></ol>`,
  chk:{q:'Khối lượng 0,4 kg ứng với trọng lượng:', o:['0,4 N','4 N','40 N','400 N'], a:1, why:'P = 10m = 4 N.'}}
 ],
 video:[{t:'title',big:'Khối lượng riêng',sub:'Vật lí 8',say:'Khối lượng riêng cho biết một đơn vị thể tích của chất nặng bao nhiêu.'},
 {t:'formula',lines:['D = m / V','m = D × V','V = m / D'],say:'D bằng m chia V. Từ đó m bằng D nhân V, và V bằng m chia D.'},
 {t:'calc',title:'Gỗ: D = 800 kg/m³, V = 500 cm³',lines:['V = 500 cm³ = 5·10⁻⁴ m³','m = 800 × 5·10⁻⁴ = 0,4 kg','P = 10 × 0,4 = 4 N'],say:'Đổi năm trăm xăng ti mét khối ra năm nhân mười mũ trừ bốn mét khối. Khối lượng bằng tám trăm nhân năm nhân mười mũ trừ bốn, là không phẩy bốn ki lô gam. Trọng lượng là bốn niu tơn.'},
 {t:'list',items:['1 g/cm³ = 1000 kg/m³','Đo D: cân + bình chia độ','Cùng chất → cùng D'],say:'Nhớ: một gam trên xăng ti mét khối bằng một nghìn ki lô gam trên mét khối. Muốn đo D, dùng cân và bình chia độ.'}]},

{id:'l2', s:'ly', n:'Vật lí', title:'Áp suất', goal:'Áp lực, p = F/S, áp suất chất lỏng p = d·h.',
 steps:[
 {h:'Áp lực và áp suất chất rắn', html:`<p><b>Áp lực</b>: lực ép có phương <b>vuông góc</b> với mặt bị ép.</p>

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const el = (h) => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild; };
const rnd = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick = a => a[Math.floor(Math.random()*a.length)];
const fmt = (x,d=2)=>{ const v=+(+x).toFixed(d); return String(v).replace('.',','); };
const SUBS={'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9','²':'2','³':'3'};
function norm(s){ return String(s).toLowerCase().replace(/[₀-₉²³]/g,c=>SUBS[c]).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/\s+/g,' ').trim(); }
function nums(s){
  let t=String(s).replace(/(\d)\s(?=\d{3}(?!\d))/g,'$1').replace(/,/g,'.');
  return (t.match(/-?\d+(?:\.\d+)?/g)||[]).map(Number);
}
const numOK=(have,want)=>have.some(h=>Math.abs(h-want)<=Math.max(Math.abs(want)*0.015,0.011));
function hasKw(t,alt){
  alt=norm(alt);
  if(/^\w{1,3}$/.test(alt)) return new RegExp('(^|[^a-z0-9])'+alt+'([^a-z0-9]|$)').test(t);
  return t.includes(alt);
}
/* Chấm tự luận: trả về {score 0..1, miss:[...]} hoặc null nếu không có khóa chấm */
function gradeSub(sub, input){
  const t=norm(input), ns=nums(input);
  if(!t) return {score:0,empty:true};
  const gN=(sub.nums||[]), gK=(sub.kw||[]);
  const nHit=gN.filter(g=>g.some(w=>numOK(ns,w))).length;
  const kHit=gK.filter(g=>g.some(a=>hasKw(t,a))).length;
  const total=gN.length+gK.length;
  if(!total) return null;
  if(sub.anyOf){ const ok=(gN.length&&nHit===gN.length)||(gK.length&&kHit===gK.length); return {score:ok?1:Math.max(nHit,kHit)/Math.max(gN.length,gK.length)*0.5}; }
  return {score:(nHit+kHit)/total, nMiss:gN.length-nHit, kMiss:gK.length-kHit};
}

  const c=el('<div class="confetti" aria-hidden="true"></div>'); const cols=['#FFD84D','#2A62D0','#128A5C','#D9481F','#E8508F'];

  document.body.appendChild(c); setTimeout(()=>c.remove(),3600);
}

   <div class="card"><h3>Mẹo nhớ nhanh</h3><div class="eq" style="font-size:17px">n = m/M<br>V = n × 24,79<br>d = M<sub>A</sub>/29<br>p = F/S &nbsp; D = m/V</div></div>

  const L=lessonById(id); if(!L){ m.innerHTML='<p>Không tìm thấy bài.</p>'; return; }
  const idx=LESSONS.indexOf(L), nx=LESSONS[idx+1], pv=LESSONS[idx-1];
  m.innerHTML=`<p class="crumb"><a href="#learn">Bài học</a> / <span class="t-${L.s}">${SUBJ[L.s].name}</span></p>
  <h2>${L.n}: ${L.title}</h2><p class="muted">Mục tiêu: ${L.goal}</p>
  <div class="tabs" role="tablist"><button role="tab" data-tab="learn">Học từng bước</button><button role="tab" data-tab="video">Xem video</button><button role="tab" data-tab="sum">Tóm tắt &amp; đề liên quan</button></div>
  <div id="pane"></div>
  <div class="row" style="margin-top:22px;justify-content:space-between">${pv?`<a class="btn sm" href="#lesson-${pv.id}">← ${pv.title}</a>`:'<span></span>'}${nx?`<a class="btn sm" href="#lesson-${nx.id}">${nx.title} →</a>`:''}</div>`;
  const show=t=>{ tabState=t; stopVideo(); $$('.tabs button',m).forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t)); const p=$('#pane'); ({learn:paneSteps,video:paneVideo,sum:paneSum})[t](p,L); };
  $$('.tabs button',m).forEach(b=>b.onclick=()=>show(b.dataset.tab));
  show(tabState);

function mcBlock(chk, onDone){
  const b=el(`<div class="chk"><div class="q">Kiểm tra nhanh: ${chk.q}</div><div class="opts">${chk.o.map((t,i)=>`<button class="opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${t}</span></button>`).join('')}</div><div class="fbw" aria-live="polite"></div></div>`);
  let tries=0;
  $$('.opt',b).forEach(o=>o.onclick=()=>{
    if(o.disabled) return; const i=+o.dataset.i; tries++;
    if(i===chk.a){ o.classList.add('ok'); $$('.opt',b).forEach(x=>x.disabled=true); $('.fbw',b).innerHTML=`<div class="fb ok"><b class="big">${pick(PRAISE)}</b>${chk.why}</div>`; if(tries===1) addXP(5); onDone&&onDone(tries===1); }
    else { o.classList.add('bad'); o.disabled=true; $('.fbw',b).innerHTML=`<div class="fb bad"><b class="big">Thử lại nhé!</b>Đọc lại phần trên rồi chọn đáp án khác. Em làm được mà.</div>`; if(tries>=2 && $$('.opt:not([disabled])',b).length===1){} }
  });
  return b;
}
function paneSteps(p,L){
  p.innerHTML=''; let unlocked=0;
  const render=(i)=>{
    const st=L.steps[i];
    const box=el(`<section class="card step"><div class="sh"><b>${i+1}/${L.steps.length}</b><h3 style="margin:0">${st.h}</h3></div><div class="body">${st.html}</div></section>`);
    p.appendChild(box);
    const next=()=>{
      if(i+1<L.steps.length){ const nb=el('<div class="row"><button class="btn pri">Bước tiếp theo →</button></div>'); box.appendChild(nb); $('button',nb).onclick=()=>{ nb.remove(); render(i+1); p.lastChild.scrollIntoView({behavior:'smooth',block:'start'}); }; }
      else finish();
    };
    if(st.chk) box.appendChild(mcBlock(st.chk,()=>next()));
    else next();
  };
  const finish=()=>{
    const first=!S.lessons[L.id]; S.lessons[L.id]=true; if(first){ addXP(30); confetti(); } save();
    const rel=TESTS.map(t=>({t,n:t.mc.filter(q=>q.lesson===L.id).length+t.tl.reduce((a,q)=>a+q.subs.filter(s=>s.lesson===L.id).length,0)})).filter(x=>x.n);
    p.appendChild(el(`<div class="card" style="background:var(--okbg);margin-top:14px"><h3>${first?'Hoàn thành bài! Giỏi lắm, em nhận 30 điểm!':'Em đã học xong bài này rồi, giỏi lắm!'}</h3><p>Tiếp theo: xem video để khắc sâu, rồi làm đề.</p><div class="row"><button class="btn" id="gv">Xem video</button><a class="btn pri" href="#practice">Luyện dạng toán</a>${rel[0]?`<a class="btn" href="#test-${rel[0].t.id}">Làm ${rel[0].t.short}</a>`:''}</div></div>`));
    $('#gv').onclick=()=>$('[data-tab=video]').click();
  };
  p.appendChild(el(`<p class="muted">Cô sẽ dạy từng bước. Em đọc xong rồi trả lời câu kiểm tra để mở bước tiếp theo.</p>`));
  render(0);
}
function paneSum(p,L){
  const rel=TESTS.map(t=>{ const mc=t.mc.map((q,i)=>({q,i})).filter(x=>x.q.lesson===L.id); const tl=t.tl.flatMap(q=>q.subs).filter(s=>s.lesson===L.id).length; return {t,mc:mc.length,tl}; }).filter(x=>x.mc||x.tl);
  p.innerHTML=`<div class="card"><h3>Tóm tắt</h3>${L.steps.map(s=>`<h4>${s.h}</h4>${s.html}`).join('')}</div>
  <div class="card" style="margin-top:14px"><h3>Câu hỏi về bài này trong các đề</h3>${rel.length?rel.map(x=>`<p><a href="#test-${x.t.id}"><b>${x.t.short}</b></a>: ${x.mc} trắc nghiệm, ${x.tl} ý tự luận</p>`).join(''):'<p class="muted">Chưa có câu trực tiếp.</p>'}</div>`;
}

/* ===================== VIDEO (hoạt hình + giọng đọc) ===================== */
let VP=null;
function stopVideo(){ if(VP){ VP.dead=true; clearTimeout(VP.timer); } VP=null; try{speechSynthesis.cancel();}catch(e){} }
function paneVideo(p,L){
  const sc=L.video; let i=0, playing=false, speed=1, mute=false;
  p.innerHTML=`<div class="screen" id="scr"></div><div class="cap" id="cap" aria-live="polite"></div>
  <div class="ctl"><button class="btn sm" id="pv" aria-label="Cảnh trước">⏮</button><button class="btn sm pri" id="pp" style="min-width:110px">Phát</button><button class="btn sm" id="nv" aria-label="Cảnh sau">⏭</button>
  <button class="btn sm" id="sp">Tốc độ 1×</button><button class="btn sm" id="mu">Giọng đọc: Bật</button><select id="vs" hidden aria-label="Chọn giọng đọc" style="padding:6px;border-radius:10px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);max-width:220px"></select><div class="dots" id="dots">${sc.map((_,k)=>`<i data-k="${k}"></i>`).join('')}</div></div>
  <p class="muted" id="vn" style="font-size:14px"></p>`;
  const ctx={dead:false,timer:null}; VP=ctx;
  let voice=null; const score=v=>(/natural|online|hoaimy|google|neural/i.test(v.name)?4:0)+(/female|nu|hoai|linh|mai|my/i.test(v.name)?2:0)+(/^vi/i.test(v.lang)?1:0);
  const pickVoice=()=>{ try{ const vs=speechSynthesis.getVoices().filter(v=>/^vi/i.test(v.lang)); vs.sort((a,b)=>score(b)-score(a)); const sel=$('#vs'); if(sel&&vs.length){ sel.innerHTML=vs.map((v,k)=>`<option value="${k}">${v.name}</option>`).join(''); sel.hidden=false; sel.onchange=()=>{voice=vs[+sel.value]; if(playing) go(i);}; } voice=vs[0]||null; }catch(e){} };
  try{ speechSynthesis.onvoiceschanged=pickVoice; }catch(e){} pickVoice();
  const scene=s=>{
    if(s.t==='title') return `<div class="scene"><div class="big">${s.big}</div><div class="sub">${s.sub||''}</div></div>`;
    if(s.t==='list') return `<div class="scene"><ul>${s.items.map((x,k)=>`<li style="animation-delay:${k*0.9}s">${x}</li>`).join('')}</ul></div>`;
    if(s.t==='formula') return `<div class="scene">${s.lines.map((x,k)=>`<div class="f" style="animation-delay:${k*1.1}s">${x}</div>`).join('')}</div>`;
    if(s.t==='calc') return `<div class="scene"><div class="ct">${s.title}</div>${s.lines.map((x,k)=>`<div class="f" style="animation-delay:${.8+k*1.5}s">${x}</div>`).join('')}</div>`;
    if(s.t==='compare') return `<div class="scene"><div class="cmp"><div style="animation-delay:.2s"><h4>${s.a.h}</h4>${s.a.l.map(x=>`<p>${x}</p>`).join('')}</div><div style="animation-delay:1.4s"><h4>${s.b.h}</h4>${s.b.l.map(x=>`<p>${x}</p>`).join('')}</div></div></div>`;
    if(s.t==='svg') return `<div class="scene" style="padding:2%">${VIS[s.key]()}</div>`;
    return '';
  };
  const go=(k,auto)=>{
    clearTimeout(ctx.timer); try{speechSynthesis.cancel();}catch(e){}
    i=Math.max(0,Math.min(sc.length-1,k));
    $('#scr').innerHTML=scene(sc[i]); $('#cap').textContent=sc[i].say;
    $$('#dots i').forEach((d,j)=>{ d.className=j===i?'on':(j<i?'past':''); });
    if(playing) speakThen();
  };
  const speakThen=()=>{
    const s=sc[i]; const est=Math.max(4200,s.say.length*(mute||!voice?85:70)/speed);
    let fired=false; const adv=()=>{ if(fired||ctx.dead||!playing) return; fired=true; clearTimeout(ctx.timer); if(i<sc.length-1) go(i+1,true); else { playing=false; $('#pp').textContent='Xem lại'; i=-1; if(!S.seen[L.id]){ S.seen[L.id]=1; addXP(10); toast('Em đã xem hết video, +10 điểm!'); } } };
    ctx.timer=setTimeout(adv, est*1.6+1500);
    if(!mute && voice){ try{ const u=new SpeechSynthesisUtterance(s.say); u.lang='vi-VN'; u.voice=voice; u.rate=speed*0.92; u.pitch=1.08; u.onend=()=>setTimeout(adv,500); u.onerror=()=>{}; speechSynthesis.speak(u);}catch(e){ ctx.timer=setTimeout(adv,est); } }
    else { clearTimeout(ctx.timer); ctx.timer=setTimeout(adv,est); }
  };
  $('#pp').onclick=()=>{ if(playing){ playing=false; clearTimeout(ctx.timer); try{speechSynthesis.cancel();}catch(e){} $('#pp').textContent='Tiếp tục'; } else { playing=true; $('#pp').textContent='Tạm dừng'; if(i<0) i=0; go(i); } };
  $('#pv').onclick=()=>go(i-1); $('#nv').onclick=()=>go(i+1);
  $('#sp').onclick=e=>{ speed=speed===1?1.25:speed===1.25?0.8:1; e.target.textContent='Tốc độ '+speed+'×'; if(playing) go(i); };
  $('#mu').onclick=e=>{ mute=!mute; e.target.textContent='Giọng đọc: '+(mute?'Tắt':'Bật'); if(playing) go(i); };
  $$('#dots i').forEach(d=>d.onclick=()=>go(+d.dataset.k));
  setTimeout(()=>{ $('#vn').textContent= voice?'Giọng đọc tiếng Việt đang bật. Nhấn Phát để xem.':'Thiết bị chưa có giọng đọc tiếng Việt, video chạy kèm phụ đề. Nhấn Phát để xem.'; },400);
  go(0);
}

 {id:'nh',s:'hoa',name:'Tỏa nhiệt / thu nhiệt',lesson:'h2',mc:true,make(){const x=pick(POOL_NH);return{q:`<b>${x[0]}</b> là phản ứng:`,o:['Tỏa nhiệt','Thu nhiệt'],a:x[1]==='toa'?0:1,steps:x[1]==='toa'?'Giải phóng nhiệt → tỏa nhiệt.':'Cần cung cấp nhiệt liên tục → thu nhiệt.'}}},
 {id:'D',s:'ly',name:'Khối lượng riêng D = m/V',lesson:'l1',make(){const D=pick([800,1000,2700,7800,8900,11300]),V=pick([50,100,200,300,500]);const m=D*V/1e6;return{q:`Một vật có khối lượng <b>${fmt(m*1000,1)} g</b> và thể tích <b>${V} cm³</b>. Tính khối lượng riêng theo kg/m³.`,unit:'kg/m³',ans:D,steps:`D = m/V = ${fmt(m*1000,1)} g / ${V} cm³ = ${fmt(D/1000,3)} g/cm³ = <b>${D} kg/m³</b>.`,hint:'1 g/cm³ = 1000 kg/m³.'}}},
 {id:'mDV',s:'ly',name:'Tính khối lượng m = D·V',lesson:'l1',make(){const D=pick([800,1000,2700,7800]),V=pick([100,200,500,1000]);return{q:`Vật có D = <b>${D} kg/m³</b>, V = <b>${V} cm³</b>. Tính khối lượng (kg).`,unit:'kg',ans:D*V/1e6,steps:`V = ${V} cm³ = ${V/1e6} m³.<br>m = D·V = ${D} × ${V/1e6} = <b>${fmt(D*V/1e6,4)} kg</b>.`,hint:'Đổi V ra m³ trước (÷ 1 000 000).'}}},
 {id:'p',s:'ly',name:'Áp suất p = F/S',lesson:'l2',make(){const m=pick([40,45,50,60,70]),a=pick([0.01,0.015,0.02,0.025]),two=pick([1,2]);return{q:`Người nặng <b>${m} kg</b> đứng bằng <b>${two===2?'hai':'một'} chân</b>, diện tích một bàn chân là <b>${fmt(a,3)} m²</b>. Tính áp suất lên sàn (Pa).`,unit:'Pa',ans:10*m/(a*two),steps:`F = 10 × ${m} = ${10*m} N. S = ${two} × ${fmt(a,3)} = ${fmt(a*two,3)} m².<br>p = F/S = <b>${fmt(10*m/(a*two),0)} Pa</b>.`,hint:'F = 10m; chú ý số chân.'}}},
 {id:'FA',s:'ly',name:'Lực đẩy Archimedes',lesson:'l3',make(){const V=pick([100,200,300,500,1000]),P=pick([5,8,10,12]);const F=10000*V/1e6;return{q:`Vật có thể tích <b>${V} cm³</b> nhúng chìm hoàn toàn trong nước (d = 10 000 N/m³). Tính lực đẩy Archimedes (N).`,unit:'N',ans:F,steps:`V = ${V/1e6} m³. F_A = d·V = 10 000 × ${V/1e6} = <b>${fmt(F,2)} N</b>.`,hint:'F_A = d × V (V đổi ra m³).'}}},
 {id:'lk',s:'ly',name:'Số chỉ lực kế khi nhúng nước',lesson:'l3',make(){const V=pick([100,200,300,500]),P=pick([4,5,6,8,10]);const F=10000*V/1e6;return{q:`Quả nặng có trọng lượng <b>${P} N</b> (ngoài không khí), thể tích <b>${V} cm³</b>. Nhúng chìm trong nước (d = 10 000 N/m³) thì lực kế chỉ bao nhiêu N?`,unit:'N',ans:P-F,steps:`F_A = 10 000 × ${V/1e6} = ${fmt(F,2)} N.<br>P′ = P − F_A = ${P} − ${fmt(F,2)} = <b>${fmt(P-F,2)} N</b>.`,hint:'P′ = P − F_A.'}}},
 {id:'tl',s:'ly',name:'Máy thủy lực F/f = S/s',lesson:'l4',make(){const f=pick([50,100,200]),k=pick([20,50,100,200]),s=pick([2,5,10]);return{q:`Pit-tông nhỏ có diện tích <b>${s} cm²</b>, tác dụng lực <b>${f} N</b>. Pit-tông lớn có diện tích <b>${s*k} cm²</b>. Tính lực nâng ở pit-tông lớn (N).`,unit:'N',ans:f*k,steps:`F/f = S/s ⇒ F = f × S/s = ${f} × ${s*k}/${s} = <b>${f*k} N</b>.`,hint:'F = f × S/s.'}}}
];
let pcur=null;
function vPractice(m){
  const by=S.prac.byType||{};
  const grp=s=>`<div class="subjhead t-${s}"><h3 style="margin:0">${SUBJ[s].name}</h3></div><div class="grid g3">${GEN.filter(g=>g.s===s).map(g=>`<button class="card lcard" data-g="${g.id}" style="text-align:left"><span class="tag t-${s}" style="align-self:flex-start">Dạng</span><h3 style="margin:2px 0">${g.name}</h3><span class="muted" style="font-size:14px">Đã đúng ${(by[g.id]||{ok:0}).ok}/${(by[g.id]||{n:0}).n} câu</span></button>`).join('')}</div>`;
  m.innerHTML=`<h2>Luyện theo dạng toán</h2><p class="muted">Mỗi lần ra một đề số khác nhau. Em nhập kết quả, máy chấm ngay và hiện cách giải. (Dùng dấu phẩy hoặc dấu chấm đều được.)</p><div id="pbox"></div>`+grp('hoa')+grp('ly');
  $$('[data-g]',m).forEach(b=>b.onclick=()=>{ pcur=GEN.find(g=>g.id===b.dataset.g); runPractice(); $('#pbox').scrollIntoView({behavior:'smooth',block:'start'}); });
  if(pcur) runPractice();
}
function runPractice(){
  const g=pcur, P=g.make(), box=$('#pbox');
  box.innerHTML=`<div class="card" style="margin-bottom:10px"><span class="tag t-${g.s}">${g.name}</span><p style="font-size:18px;margin:10px 0">${P.q}</p><div id="ans"></div><div id="fbp" aria-live="polite"></div></div>`;
  const rec=ok=>{ const t=(S.prac.byType[g.id]=S.prac.byType[g.id]||{ok:0,n:0}); t.n++; if(ok) t.ok++; S.prac.total++; if(ok){ S.prac.ok++; addXP(5);} else save(); };
  const next=()=>`<div class="row"><button class="btn pri" id="nxt">Câu tiếp theo</button></div>`;
  if(g.mc){
    const a=$('#ans'); a.innerHTML=`<div class="opts">${P.o.map((t,i)=>`<button class="opt" data-i="${i}"><span class="k">${'AB'[i]}</span><span>${t}</span></button>`).join('')}</div>`;
    $$('.opt',a).forEach(b=>b.onclick=()=>{ const ok=+b.dataset.i===P.a; $$('.opt',a).forEach(x=>x.disabled=true); b.classList.add(ok?'ok':'bad'); $$('.opt',a)[P.a].classList.add('ok'); rec(ok); $('#fbp').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b class="big">${ok?pick(PRAISE):pick(COMFORT)}</b>${P.steps}</div>`+next(); $('#nxt').onclick=runPractice; });
  } else {
    $('#ans').innerHTML=`<div class="row"><input type="text" id="pin" inputmode="decimal" placeholder="Nhập kết quả (${P.unit})" style="max-width:260px" aria-label="Kết quả"><button class="btn pri" id="chk">Chấm</button><button class="btn" id="hn">Gợi ý</button></div>`;
    const submit=()=>{ const v=nums($('#pin').value)[0]; if(v===undefined){ toast('Em hãy nhập một số nhé'); return; } const ok=numOK([v],P.ans); $('#pin').disabled=true; $('#chk').disabled=true; rec(ok); if(ok&&S.prac.ok%10===0) confetti();
      $('#fbp').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b class="big">${ok?pick(PRAISE):pick(COMFORT)}</b>${ok?'':'Đáp án đúng: <b>'+fmt(P.ans,3)+' '+P.unit+'</b>.<br>'}${P.steps}</div>`+next(); $('#nxt').onclick=runPractice; };
    $('#chk').onclick=submit; $('#pin').onkeydown=e=>{ if(e.key==='Enter') submit(); }; $('#hn').onclick=()=>{ $('#fbp').innerHTML=`<div class="fb ok"><b class="big">Gợi ý</b>${P.hint}</div>`; }; $('#pin').focus();
  }
}

/* ===================== DANH SÁCH ĐỀ ===================== */
function vTests(m){
  m.innerHTML=`<h2>Đề kiểm tra</h2><p class="muted">${TESTS.length} đề, chép nguyên văn từ tài liệu của em. Trắc nghiệm chấm ngay khi chọn. Tự luận gõ đáp án rồi bấm Chấm, máy so với đáp án chuẩn và cho điểm từng ý.</p>
  <div class="grid">${TESTS.map(t=>{const r=S.tests[t.id];return `<a class="card testrow lcard" href="#test-${t.id}" style="flex-direction:row"><div class="info"><span class="tag t-${t.tag==='Lý'?'ly':t.tag==='Hóa'?'hoa':'sinh'}">${t.tag}</span><h3 style="margin:4px 0">${t.title}</h3><span class="muted" style="font-size:14px">${t.sub}</span></div><div style="text-align:right">${r?`<div class="muted" style="font-size:13px">Điểm cao nhất</div><b style="font-family:var(--fd);font-size:30px">${fmt(r.best,2)}</b><span class="muted">/10</span>`:'<span class="btn sm pri">Làm bài</span>'}</div></a>`}).join('')}</div>`;

/* ===================== LÀM ĐỀ ===================== */
let RUN=null;
function weights(t){ // điểm tối đa từng ý tự luận
  const tw=t.tl.reduce((a,q)=>a+q.w,0), out=[];
  t.tl.forEach((q,qi)=>q.subs.forEach((s,si)=>out.push({qi,si,max:t.tlPts*(q.w/tw)/q.subs.length})));
  return out;
}
function vTest(m,id){
  const t=testById(id); if(!t){ m.innerHTML='<p>Không tìm thấy đề.</p>'; return; }
  RUN={t,mc:t.mc.map(()=>null),sub:{},W:weights(t)};
  const tot=t.tnPts+t.tlPts;
  let h=`<p class="crumb"><a href="#tests">Đề kiểm tra</a></p><h2>${t.title}</h2><p class="muted">${t.sub} · Thời gian gợi ý ${t.time} phút · Thang điểm gốc ${fmt(tot,1)}${tot!==10?' (quy đổi ra /10)':''}</p>
  <h3 style="margin-top:20px">Phần I. Trắc nghiệm (${fmt(t.tnPts,2)} điểm)</h3>`;
  t.mc.forEach((q,i)=>{ h+=`<div class="qblock" id="mc${i}"><div class="qt"><span class="q-num">Câu ${i+1}.</span> ${q.q}</div>${q.fig?`<div class="fig">${FIG[q.fig]}</div>`:''}<div class="opts">${q.o.map((o,k)=>`<button class="opt" data-q="${i}" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${o}</span></button>`).join('')}</div><div class="fbw" aria-live="polite"></div></div>`; });
  h+=`<h3 style="margin-top:26px">Phần II. Tự luận (${fmt(t.tlPts,2)} điểm)</h3><p class="muted">Gõ đáp án ngắn gọn (kết quả số có thể dùng dấu phẩy). Có thể xem gợi ý trước khi chấm.</p>`;
  t.tl.forEach((q,qi)=>{ h+=`<div class="qblock"><div class="qt"><span class="q-num">Câu ${t.mc.length+qi+1}.</span> ${q.q||''}</div>${q.fig?`<div class="fig">${FIG[q.fig]}</div>`:''}`+q.subs.map((s,si)=>`<div class="subq" id="sb${qi}_${si}"><label for="in${qi}_${si}">${s.l?`<b>${s.l})</b> `:''}${s.q}</label><textarea id="in${qi}_${si}" rows="${/tính|viết|giải thích|nêu/i.test(s.q)?3:2}" placeholder="Em viết đáp án vào đây"></textarea><div class="row"><button class="btn sm pri" data-chk="${qi}_${si}">Chấm</button><button class="btn sm" data-hint="${qi}_${si}">Gợi ý</button></div><div class="fbw" aria-live="polite"></div></div>`).join('')+`</div>`; });
  h+=`<div class="sticky"><div class="score" id="sc"></div></div><div id="final"></div>`;
  m.innerHTML=h;
  $$('.opt[data-q]',m).forEach(b=>b.onclick=()=>answerMC(+b.dataset.q,+b.dataset.k));
  $$('[data-chk]',m).forEach(b=>b.onclick=()=>answerSub(b.dataset.chk));
  $$('[data-hint]',m).forEach(b=>b.onclick=()=>{ const [qi,si]=b.dataset.hint.split('_'); const s=t.tl[qi].subs[si]; const w=$('#sb'+b.dataset.hint+' .fbw'); w.innerHTML=`<div class="fb ok"><b class="big">Gợi ý</b>${s.hint||'Xem lại bài học tương ứng.'}${s.lesson?` <a href="#lesson-${s.lesson}">Mở bài học</a>`:''}</div>`; });
  updateScore();
}
function answerMC(i,k){
  const {t}=RUN; if(RUN.mc[i]!==null) return; RUN.mc[i]=k; const q=t.mc[i], ok=k===q.a, blk=$('#mc'+i);
  $$('.opt',blk).forEach((b,j)=>{ b.disabled=true; if(j===k) b.classList.add(ok?'ok':'bad'); if(j===q.a&&!ok) b.classList.add('reveal','ok'); });
  $('.fbw',blk).innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b class="big">${ok?pick(PRAISE):pick(COMFORT)}</b>Đáp án đúng: <b>${'ABCD'[q.a]}</b>. ${q.why}${q.lesson?` <a href="#lesson-${q.lesson}">Học lại: ${lessonById(q.lesson).title}</a>`:''}${q.note?`<br><i>${q.note}</i>`:''}</div>`;
  if(ok) addXP(2); updateScore();
}
function answerSub(key){
  const [qi,si]=key.split('_').map(Number), s=RUN.t.tl[qi].subs[si], inp=$('#in'+key), w=$('#sb'+key+' .fbw');
  const val=inp.value.trim(); if(!val){ toast('Em hãy viết đáp án trước khi chấm nhé'); return; }
  const g=gradeSub(s,val); const auto=g?g.score:0;
  RUN.sub[key]={val,score:auto,manual:!g};
  paintSub(key,s,w,g);
  updateScore();
}
function paintSub(key,s,w,g){
  const r=RUN.sub[key], sc=r.score, ok=sc>=0.99, part=!ok&&sc>=0.5;
  const head=ok?pick(PRAISE):part?'Gần đúng rồi, em thiếu một ý!':(g?pick(COMFORT):'Em so với đáp án mẫu rồi tự chấm nhé.');
  w.innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b class="big">${head}</b>${g?`Máy chấm: <b>${Math.round(sc*100)}%</b> ý này.<br>`:''}<b>Đáp án mẫu:</b><div style="margin:4px 0 6px">${s.a}</div>${ok?'':`<div class="row"><button class="btn sm" data-over="${key}">Em đã làm đúng ý này (tự chấm)</button><button class="btn sm" data-retry="${key}">Làm lại</button></div>`}${s.lesson&&!ok?`<a href="#lesson-${s.lesson}">Học lại: ${lessonById(s.lesson).title}</a>`:''}</div>`;
  const o=$('[data-over]',w); if(o) o.onclick=()=>{ r.score=1; r.manual=true; paintSub(key,s,w,g); w.querySelector('.fb').insertAdjacentHTML('afterbegin','<b class="big">Ghi nhận em đã làm đúng!</b>'); updateScore(); };
  const rt=$('[data-retry]',w); if(rt) rt.onclick=()=>{ delete RUN.sub[key]; w.innerHTML=''; updateScore(); $('#in'+key).focus(); };
  if(ok) addXP(3);
}
function calc(){
  const {t,mc,sub,W}=RUN; const c=mc.filter((a,i)=>a===t.mc[i].a).length, d=mc.filter(a=>a!==null).length;
  const tn=t.tnPts*c/t.mc.length; let tl=0, done=0; W.forEach(x=>{ const r=sub[x.qi+'_'+x.si]; if(r){ done++; tl+=x.max*r.score; } });
  const tot=t.tnPts+t.tlPts; return {c,d,tn,tl,done,tot,total:tn+tl,ten:(tn+tl)/tot*10,allDone:d===t.mc.length&&done===W.length};
}
function updateScore(){
  const r=calc(), t=RUN.t;
  $('#sc').innerHTML=`<span>Trắc nghiệm <b class="num">${r.c}/${t.mc.length}</b></span><span>Tự luận đã chấm <b class="num">${r.done}/${RUN.W.length}</b></span><span>Điểm tạm tính <b class="num">${fmt(r.ten,2)}</b>/10</span><button class="btn sm pri" id="fin" style="margin-left:auto">Xem kết quả</button>`;
  $('#fin').onclick=finish;
}
function finish(){
  const r=calc(), t=RUN.t; const un=(r.d<t.mc.length||r.done<RUN.W.length);
  const first=!S.tests[t.id]; const prev=S.tests[t.id]; S.tests[t.id]={best:Math.max(prev?prev.best:0,r.ten),last:r.ten,n:(prev?prev.n:0)+1,at:Date.now()}; if(first) addXP(40); save();
  const band=r.ten>=9?['Xuất sắc! Em giỏi lắm, cứ thế phát huy nhé!','Em nắm bài rất chắc. Cô tự hào về em!']:r.ten>=8?['Giỏi lắm! Chỉ sai một chút xíu thôi.','Em làm rất tốt. Xem lại vài chỗ sai là hoàn hảo.']:r.ten>=6.5?['Khá tốt! Em đang tiến bộ.','Xem lại các câu sai, làm lại đề này sẽ cao hơn.']:['Đừng nản nhé, em làm được mà!','Học lại bài ở các liên kết bên dưới rồi làm lại, em sẽ tiến bộ ngay.'];
  if(r.ten>=8) confetti();
  const wrong=[]; t.mc.forEach((q,i)=>{ if(RUN.mc[i]!==q.a&&q.lesson) wrong.push(q.lesson); }); t.tl.forEach((q,qi)=>q.subs.forEach((s,si)=>{ const x=RUN.sub[qi+'_'+si]; if((!x||x.score<0.99)&&s.lesson) wrong.push(s.lesson); }));
  const uniq=[...new Set(wrong)];
  $('#final').innerHTML=`<div class="card" style="margin-top:18px;text-align:center"><p class="muted" style="margin:0">Điểm của em</p><div class="bigscore num">${fmt(r.ten,2)}</div><p class="muted">/10 ${t.tnPts+t.tlPts!==10?`(đề gốc ${fmt(r.total,2)}/${fmt(t.tnPts+t.tlPts,1)})`:''} · Trắc nghiệm ${fmt(r.tn,2)}/${t.tnPts} · Tự luận ${fmt(r.tl,2)}/${t.tlPts}</p>
  <h3>${band[0]}</h3><p>${band[1]}</p>${un?'<p class="muted">Còn câu chưa làm nên điểm có thể thấp hơn thực tế.</p>':''}
  ${uniq.length?`<p><b>Nên học lại:</b></p><div class="row" style="justify-content:center">${uniq.map(id=>`<a class="btn sm" href="#lesson-${id}">${lessonById(id).title}</a>`).join('')}</div>`:'<p><b>Không còn chỗ nào cần học lại. Tuyệt vời!</b></p>'}
  <div class="row" style="justify-content:center;margin-top:14px"><a class="btn pri" href="#test-${t.id}" onclick="setTimeout(route,0)">Làm lại đề này</a><a class="btn" href="#tests">Chọn đề khác</a></div></div>`;
  $('#final').scrollIntoView({behavior:'smooth',block:'start'});
